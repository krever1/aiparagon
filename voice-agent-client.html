<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,600;12..96,75..100,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1526;
    --panel: #262034;
    --panel-2: #2E2740;
    --line: #3C3350;
    --text: #EFE9F5;
    --dim: #A093B2;
    --you: #FFB300;
    --agent: #74C6B5;
    --danger: #E8705A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-optical-sizing: auto;
  }

  body { min-height: 100vh; display: flex; justify-content: center; padding: 32px 20px 56px; }
  .shell { width: 100%; max-width: 720px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 20px; font-weight: 800; font-stretch: 90%; letter-spacing: -0.02em; margin: 0; }

  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); transition: background .2s ease; }
  .status[data-state="connecting"] .dot { background: #8F7FD6; animation: pulse 1.1s ease-in-out infinite; }
  .status[data-state="live"] .dot,
  .status[data-state="hearing"] .dot { background: var(--you); }
  .status[data-state="speaking"] .dot { background: var(--agent); }
  .status[data-state="error"] .dot { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .25; } }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 44px 0 34px; }

  .orb-wrap { position: relative; width: 208px; height: 208px; display: grid; place-items: center; }
  .rings { position: absolute; inset: 0; transform: rotate(-90deg); }
  .rings circle { fill: none; stroke-linecap: round; }
  .rings .track { stroke: var(--line); stroke-width: 1.5; }
  .rings .arc { stroke-width: 4; transition: stroke-dashoffset .07s linear, opacity .3s ease; opacity: 0; }
  .rings .agent-arc { stroke: var(--agent); }
  .rings .you-arc { stroke: var(--you); }
  .live .rings .arc { opacity: 1; }

  .call {
    width: 126px; height: 126px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); font-family: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; display: grid; place-items: center; padding: 0 16px; line-height: 1.25;
    transition: background .2s ease, border-color .2s ease, transform .12s ease, color .2s ease;
  }
  .call:hover { border-color: #52456B; }
  .call:active { transform: scale(.97); }
  .call:focus-visible { outline: 2px solid var(--you); outline-offset: 4px; }
  .call[data-state="live"], .call[data-state="hearing"], .call[data-state="speaking"] {
    background: rgba(232,112,90,.14); border-color: rgba(232,112,90,.5); color: #F4B6A8;
  }
  .call:disabled { cursor: wait; color: var(--dim); }

  .hint { font-size: 13px; color: var(--dim); text-align: center; min-height: 18px; }

  .controls { display: flex; gap: 10px; }
  .chip {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 7px 15px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .chip:hover { border-color: #52456B; color: var(--text); }
  .chip[aria-pressed="true"] { border-color: var(--you); color: var(--you); }
  .chip:disabled { opacity: .4; cursor: not-allowed; }
  .chip:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }

  .transcript { border-top: 1px solid var(--line); padding-top: 24px; }
  .turn { display: grid; grid-template-columns: 78px 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(60,51,80,.5); }
  .turn:last-child { border-bottom: none; }
  .who { font-size: 13px; font-weight: 600; padding-top: 3px; }
  .turn[data-who="you"] .who { color: var(--you); }
  .turn[data-who="agent"] .who { color: var(--agent); }
  .turn[data-who="note"] .who { color: var(--dim); }
  .time { display: block; font-size: 12px; color: var(--dim); font-weight: 400; margin-top: 3px; }
  .said { font-family: "Newsreader", Georgia, serif; font-size: 18px; line-height: 1.55; margin: 0; max-width: 62ch; }
  .turn[data-live="true"] .said { color: var(--dim); }
  .turn[data-who="note"] .said { font-style: italic; color: var(--dim); font-size: 16px; }
  .empty { color: var(--dim); font-family: "Newsreader", Georgia, serif; font-size: 18px; margin: 0; }

  .error {
    margin-top: 16px; border: 1px solid rgba(232,112,90,.4); background: rgba(232,112,90,.08);
    color: #F4B6A8; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5;
  }
  .error:empty { display: none; }

  .settings { margin-top: 32px; }
  .settings summary { cursor: pointer; font-size: 14px; color: var(--dim); list-style: none; }
  .settings summary::-webkit-details-marker { display: none; }
  .settings summary::before { content: "+ "; }
  .settings[open] summary::before { content: "\2013 "; }
  .settings summary:focus-visible { outline: 2px solid var(--you); outline-offset: 3px; }
  .fields {
    margin-top: 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; display: grid; gap: 14px;
  }
  label.field { display: grid; gap: 6px; font-size: 13px; color: var(--dim); }
  input[type="text"], select {
    background: var(--ink); border: 1px solid var(--line); border-radius: 9px; color: var(--text);
    padding: 10px 12px; font-family: inherit; font-size: 14px; width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--you); outline-offset: 1px; border-color: transparent; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button.plain {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 9px 14px; font-family: inherit; font-size: 14px; cursor: pointer;
  }
  button.plain:hover { border-color: #52456B; }
  button.plain:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 520px) {
    .turn { grid-template-columns: 62px 1fr; gap: 12px; }
    .said { font-size: 17px; }
  }
</style>
</head>
<body>
<main class="shell" id="shell">

  <header>
    <h1>Voice agent</h1>
    <span class="status" id="status" data-state="idle"><span class="dot"></span><span id="statusText">Not connected</span></span>
  </header>

  <section class="stage">
    <div class="orb-wrap">
      <svg class="rings" viewBox="0 0 208 208" aria-hidden="true">
        <circle class="track" cx="104" cy="104" r="94"></circle>
        <circle class="arc agent-arc" id="agentArc" cx="104" cy="104" r="94"></circle>
        <circle class="track" cx="104" cy="104" r="79"></circle>
        <circle class="arc you-arc" id="youArc" cx="104" cy="104" r="79"></circle>
      </svg>
      <button class="call" id="call" data-state="idle">Call</button>
    </div>
    <p class="hint" id="hint">Tap to start. Talk normally, and interrupt whenever you like.</p>
    <div class="controls">
      <button class="chip" id="mute" aria-pressed="false" disabled>Mute</button>
      <button class="chip" id="copy">Copy transcript</button>
    </div>
  </section>

  <section class="transcript" id="transcript">
    <p class="empty">No call yet. Start one and the conversation appears here as it happens.</p>
  </section>

  <div class="error" id="error" role="alert"></div>

  <details class="settings">
    <summary>Connection</summary>
    <div class="fields">
      <label class="field">
        Session webhook (n8n mints the call key here)
        <input type="text" id="webhook" spellcheck="false">
      </label>
      <label class="field">
        Voice
        <select id="voice">
          <option value="marin">Marin</option>
          <option value="cedar">Cedar</option>
          <option value="alloy">Alloy</option>
          <option value="shimmer">Shimmer</option>
        </select>
      </label>
      <label class="field">
        Transcript log webhook (optional, each finished turn is POSTed here)
        <input type="text" id="logUrl" spellcheck="false" placeholder="Leave empty to skip">
      </label>
      <div class="row">
        <button class="plain" id="clear">Clear transcript</button>
      </div>
    </div>
  </details>

</main>

<script>
(() => {
  const DEFAULT_WEBHOOK = "https://n8n.aiparagonconsulting.com/webhook/voice-session";
  const CALLS_URL = "https://api.openai.com/v1/realtime/calls";

  const els = {
    shell: document.getElementById("shell"),
    call: document.getElementById("call"),
    mute: document.getElementById("mute"),
    copy: document.getElementById("copy"),
    clear: document.getElementById("clear"),
    status: document.getElementById("status"),
    statusText: document.getElementById("statusText"),
    hint: document.getElementById("hint"),
    agentArc: document.getElementById("agentArc"),
    youArc: document.getElementById("youArc"),
    transcript: document.getElementById("transcript"),
    error: document.getElementById("error"),
    webhook: document.getElementById("webhook"),
    voice: document.getElementById("voice"),
    logUrl: document.getElementById("logUrl")
  };

  const LEN_OUT = 2 * Math.PI * 94;
  const LEN_IN = 2 * Math.PI * 79;
  els.agentArc.style.strokeDasharray = LEN_OUT;
  els.youArc.style.strokeDasharray = LEN_IN;
  els.agentArc.style.strokeDashoffset = LEN_OUT;
  els.youArc.style.strokeDashoffset = LEN_IN;

  els.webhook.value = DEFAULT_WEBHOOK;

  const STATUS = {
    idle: "Not connected",
    connecting: "Connecting",
    live: "On the call",
    hearing: "Hearing you",
    speaking: "Speaking",
    error: "Call ended"
  };
  const HINTS = {
    idle: "Tap to start. Talk normally, and interrupt whenever you like.",
    connecting: "Opening the line.",
    live: "Go ahead, it is listening.",
    hearing: "Go ahead, it is listening.",
    speaking: "Talk over it any time to cut in.",
    error: "Tap to try again."
  };

  let state = "idle";
  let pc = null;
  let dc = null;
  let micStream = null;
  let audioEl = null;
  let audioCtx = null;
  let youAnalyser = null;
  let agentAnalyser = null;
  let rafId = null;
  let sessionId = null;
  let turns = [];
  let live = { you: null, agent: null };

  function setState(next) {
    state = next;
    els.status.dataset.state = next;
    els.statusText.textContent = STATUS[next];
    els.hint.textContent = HINTS[next];
    els.call.dataset.state = next;
    els.call.textContent = next === "idle" || next === "error" ? "Call" : next === "connecting" ? "Connecting" : "Hang up";
    els.call.disabled = next === "connecting";
    els.mute.disabled = !(next === "live" || next === "hearing" || next === "speaking");
    els.shell.classList.toggle("live", next === "live" || next === "hearing" || next === "speaking");
  }

  function showError(msg) { els.error.textContent = msg; }
  function clearError() { els.error.textContent = ""; }

  function render() {
    if (!turns.length) {
      els.transcript.innerHTML = '<p class="empty">No call yet. Start one and the conversation appears here as it happens.</p>';
      return;
    }
    els.transcript.innerHTML = "";
    for (const t of turns) {
      const row = document.createElement("div");
      row.className = "turn";
      row.dataset.who = t.who;
      if (t.live) row.dataset.live = "true";

      const who = document.createElement("div");
      who.className = "who";
      who.textContent = t.who === "you" ? "You" : t.who === "agent" ? "Agent" : "Note";
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = t.at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      who.appendChild(time);

      const said = document.createElement("p");
      said.className = "said";
      said.textContent = t.text;

      row.append(who, said);
      els.transcript.appendChild(row);
    }
    els.transcript.lastElementChild.scrollIntoView({ block: "nearest" });
  }

  function note(text) {
    turns.push({ who: "note", text, at: new Date(), live: false });
    render();
  }

  function partial(who, chunk) {
    if (!live[who]) {
      live[who] = { who, text: "", at: new Date(), live: true };
      turns.push(live[who]);
    }
    live[who].text += chunk;
    render();
  }

  function finalize(who, text) {
    if (live[who]) {
      if (text) live[who].text = text;
      live[who].live = false;
      live[who] = null;
    } else if (text) {
      turns.push({ who, text, at: new Date(), live: false });
    }
    render();
    if (text) logTurn(who, text);
  }

  function logTurn(who, text) {
    const url = els.logUrl.value.trim();
    if (!url) return;
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, speaker: who, text, at: new Date().toISOString() })
    }).catch(() => {});
  }

  function meter() {
    const read = (analyser) => {
      if (!analyser) return 0;
      const buf = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = (buf[i] - 128) / 128;
        sum += v * v;
      }
      return Math.min(1, Math.sqrt(sum / buf.length) * 6);
    };
    els.youArc.style.strokeDashoffset = String(LEN_IN * (1 - read(youAnalyser)));
    els.agentArc.style.strokeDashoffset = String(LEN_OUT * (1 - read(agentAnalyser)));
    rafId = requestAnimationFrame(meter);
  }

  async function getSessionKey() {
    const url = els.webhook.value.trim();
    if (!url) throw new Error("Add the session webhook URL under Connection first.");

    sessionId = "call-" + Math.random().toString(36).slice(2, 8) + "-" + Date.now().toString(36);

    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, voice: els.voice.value })
      });
    } catch (err) {
      throw new Error("Could not reach n8n. Check the webhook URL and that the workflow is active.");
    }

    if (!res.ok) throw new Error("n8n returned " + res.status + ". Open the execution log to see which node failed.");

    let payload;
    try { payload = await res.json(); }
    catch (err) { throw new Error("n8n replied with something that was not JSON. Check the Return Session Key node."); }

    const status = payload.statusCode || 200;
    const body = payload.body || payload;

    if (status >= 400) {
      const detail = body && body.error && body.error.message ? body.error.message : "status " + status;
      throw new Error("OpenAI refused the session: " + detail);
    }

    const key = body.value || (body.client_secret && body.client_secret.value);
    if (!key) throw new Error("No session key came back from n8n. Check the Mint Realtime Session node output.");
    return key;
  }

  async function startCall() {
    clearError();
    setState("connecting");

    let key;
    try {
      key = await getSessionKey();
    } catch (err) {
      setState("error");
      showError(err.message);
      return;
    }

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
    } catch (err) {
      setState("error");
      showError(err && err.name === "NotAllowedError"
        ? "Microphone access was blocked. Allow the mic for this page, then call again."
        : "No microphone available. Check that one is connected and that this page is on https or localhost.");
      return;
    }

    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") await audioCtx.resume();

      pc = new RTCPeerConnection();

      audioEl = document.createElement("audio");
      audioEl.autoplay = true;
      pc.ontrack = (e) => {
        audioEl.srcObject = e.streams[0];
        try {
          const src = audioCtx.createMediaStreamSource(e.streams[0]);
          agentAnalyser = audioCtx.createAnalyser();
          agentAnalyser.fftSize = 1024;
          agentAnalyser.smoothingTimeConstant = 0.7;
          src.connect(agentAnalyser);
        } catch (err) { /* meter is cosmetic */ }
      };

      const micSrc = audioCtx.createMediaStreamSource(micStream);
      youAnalyser = audioCtx.createAnalyser();
      youAnalyser.fftSize = 1024;
      youAnalyser.smoothingTimeConstant = 0.7;
      micSrc.connect(youAnalyser);

      pc.addTrack(micStream.getTracks()[0], micStream);

      dc = pc.createDataChannel("oai-events");
      dc.addEventListener("open", onChannelOpen);
      dc.addEventListener("message", onServerEvent);

      pc.onconnectionstatechange = () => {
        if (pc && ["failed", "disconnected", "closed"].indexOf(pc.connectionState) !== -1 && state !== "idle") {
          endCall("The connection dropped.");
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const sdpRes = await fetch(CALLS_URL, {
        method: "POST",
        body: offer.sdp,
        headers: { Authorization: "Bearer " + key, "Content-Type": "application/sdp" }
      });

      const sdpText = await sdpRes.text();
      if (!sdpRes.ok) {
        throw new Error("OpenAI rejected the call handshake (" + sdpRes.status + "). " + sdpText.slice(0, 200));
      }

      await pc.setRemoteDescription({ type: "answer", sdp: sdpText });

      setState("live");
      meter();
      note("Call connected.");
    } catch (err) {
      setState("error");
      showError(err.message || "Could not open the call.");
      teardown();
    }
  }

  function onChannelOpen() {
    send({
      type: "session.update",
      session: {
        type: "realtime",
        audio: {
          input: {
            transcription: { model: "gpt-4o-transcribe" },
            turn_detection: { type: "semantic_vad", interrupt_response: true }
          }
        }
      }
    });
    send({
      type: "response.create",
      response: { instructions: "Greet the caller in one short friendly sentence and ask how you can help." }
    });
  }

  function send(obj) {
    if (dc && dc.readyState === "open") dc.send(JSON.stringify(obj));
  }

  function onServerEvent(e) {
    let ev;
    try { ev = JSON.parse(e.data); } catch (err) { return; }
    const t = ev.type || "";

    if (t === "error") {
      showError(ev.error && ev.error.message ? ev.error.message : "The session reported an error.");
      return;
    }

    if (t === "input_audio_buffer.speech_started") { if (state !== "hearing") setState("hearing"); return; }
    if (t === "input_audio_buffer.speech_stopped") { if (state === "hearing") setState("live"); return; }

    if (t === "conversation.item.input_audio_transcription.delta") { partial("you", ev.delta || ""); return; }
    if (t === "conversation.item.input_audio_transcription.completed") { finalize("you", ev.transcript || ""); return; }
    if (t === "conversation.item.input_audio_transcription.failed") { finalize("you", ""); note("That last bit could not be transcribed."); return; }

    if (t.indexOf("response.") === 0 && /audio_transcript\.delta$/.test(t)) { partial("agent", ev.delta || ""); return; }
    if (t.indexOf("response.") === 0 && /audio_transcript\.done$/.test(t)) { finalize("agent", ev.transcript || ""); return; }

    if (t === "response.created") { setState("speaking"); return; }
    if (t === "response.done") { if (state !== "idle") setState("live"); return; }
  }

  function teardown() {
    cancelAnimationFrame(rafId);
    if (dc) { try { dc.close(); } catch (e) {} dc = null; }
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    if (audioEl) { audioEl.srcObject = null; audioEl = null; }
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    youAnalyser = null;
    agentAnalyser = null;
    els.youArc.style.strokeDashoffset = LEN_IN;
    els.agentArc.style.strokeDashoffset = LEN_OUT;
    els.mute.setAttribute("aria-pressed", "false");
    els.mute.textContent = "Mute";
    live = { you: null, agent: null };
    turns.forEach((t) => (t.live = false));
    render();
  }

  function endCall(reason) {
    teardown();
    setState("idle");
    note(reason || "Call ended.");
  }

  els.call.addEventListener("click", () => {
    if (state === "idle" || state === "error") startCall();
    else endCall();
  });

  els.mute.addEventListener("click", () => {
    if (!micStream) return;
    const track = micStream.getAudioTracks()[0];
    track.enabled = !track.enabled;
    els.mute.setAttribute("aria-pressed", String(!track.enabled));
    els.mute.textContent = track.enabled ? "Mute" : "Unmute";
  });

  els.clear.addEventListener("click", () => {
    turns = [];
    live = { you: null, agent: null };
    render();
    clearError();
  });

  els.copy.addEventListener("click", async () => {
    const text = turns
      .map((t) => (t.who === "you" ? "You" : t.who === "agent" ? "Agent" : "Note") + ": " + t.text)
      .join("\n");
    try {
      await navigator.clipboard.writeText(text);
      els.copy.textContent = "Copied";
      setTimeout(() => (els.copy.textContent = "Copy transcript"), 1400);
    } catch (err) {
      showError("Copying was blocked. Select the transcript and copy it manually.");
    }
  });

  window.addEventListener("beforeunload", teardown);

  setState("idle");
  render();
})();
</script>
</body>
</html>
