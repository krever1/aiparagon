<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,600;12..96,75..100,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1526;
    --panel: #262034;
    --panel-2: #2E2740;
    --line: #3C3350;
    --text: #EFE9F5;
    --dim: #A093B2;
    --live: #FFB300;
    --agent: #74C6B5;
    --danger: #E8705A;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-optical-sizing: auto;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 20px 48px;
  }

  .shell { width: 100%; max-width: 720px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    font-size: 20px;
    font-weight: 800;
    font-stretch: 90%;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--dim);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dim);
    transition: background .2s ease;
  }
  .status[data-mode="listening"] .dot { background: var(--live); }
  .status[data-mode="thinking"]  .dot { background: #8F7FD6; }
  .status[data-mode="speaking"]  .dot { background: var(--agent); }
  .status[data-mode="error"]     .dot { background: var(--danger); }
  .status[data-mode="listening"] .dot { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 44px 0 36px;
  }

  .orb-wrap {
    position: relative;
    width: 196px; height: 196px;
    display: grid;
    place-items: center;
  }

  .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-linecap: round; }
  .ring .track { stroke: var(--line); stroke-width: 2; }
  .ring .level {
    stroke: var(--live);
    stroke-width: 4;
    transition: stroke-dashoffset .06s linear, stroke .25s ease, opacity .25s ease;
    opacity: 0;
  }

  .orb {
    width: 132px; height: 132px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    display: grid;
    place-items: center;
    padding: 0 18px;
    line-height: 1.25;
    transition: background .2s ease, border-color .2s ease, transform .12s ease, color .2s ease;
  }
  .orb:hover { border-color: #52456B; }
  .orb:active { transform: scale(.97); }
  .orb:focus-visible { outline: 2px solid var(--live); outline-offset: 4px; }
  .orb[data-mode="listening"] { background: var(--live); color: #241C0A; border-color: var(--live); }
  .orb[data-mode="thinking"], .orb[data-mode="speaking"] { color: var(--dim); cursor: default; }
  .orb:disabled { cursor: not-allowed; }

  .hint {
    font-size: 13px;
    color: var(--dim);
    text-align: center;
    min-height: 18px;
  }
  .hint kbd {
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 12px;
  }

  .handsfree {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    color: var(--dim);
    cursor: pointer;
    user-select: none;
  }
  .handsfree input { accent-color: var(--live); width: 15px; height: 15px; cursor: pointer; }

  .transcript {
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }

  .turn {
    display: grid;
    grid-template-columns: 78px 1fr;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(60,51,80,.5);
  }
  .turn:last-child { border-bottom: none; }

  .who {
    font-size: 13px;
    font-weight: 600;
    padding-top: 3px;
  }
  .turn[data-who="you"] .who { color: var(--live); }
  .turn[data-who="agent"] .who { color: var(--agent); }
  .turn[data-who="note"] .who { color: var(--dim); }

  .said {
    font-family: "Newsreader", Georgia, serif;
    font-size: 18px;
    line-height: 1.55;
    margin: 0;
    max-width: 62ch;
  }
  .turn[data-who="note"] .said { font-style: italic; color: var(--dim); font-size: 16px; }

  .time { display: block; font-size: 12px; color: var(--dim); font-weight: 400; margin-top: 3px; }

  .empty {
    color: var(--dim);
    font-family: "Newsreader", Georgia, serif;
    font-size: 18px;
    margin: 0;
  }

  .settings { margin-top: 32px; }
  .settings summary {
    cursor: pointer;
    font-size: 14px;
    color: var(--dim);
    list-style: none;
  }
  .settings summary::-webkit-details-marker { display: none; }
  .settings summary::before { content: "+ "; }
  .settings[open] summary::before { content: "– "; }
  .settings summary:focus-visible { outline: 2px solid var(--live); outline-offset: 3px; }

  .fields {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    display: grid;
    gap: 14px;
  }
  label.field { display: grid; gap: 6px; font-size: 13px; color: var(--dim); }
  input[type="text"] {
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    width: 100%;
  }
  input[type="text"]:focus { outline: 2px solid var(--live); outline-offset: 1px; border-color: transparent; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button.plain {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  button.plain:hover { border-color: #52456B; }
  button.plain:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

  .error {
    margin-top: 16px;
    border: 1px solid rgba(232,112,90,.4);
    background: rgba(232,112,90,.08);
    color: #F4B6A8;
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.5;
  }
  .error:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 520px) {
    .turn { grid-template-columns: 62px 1fr; gap: 12px; }
    .said { font-size: 17px; }
  }
</style>
</head>
<body>
<main class="shell">

  <header>
    <h1>Voice agent</h1>
    <span class="status" id="status" data-mode="idle"><span class="dot"></span><span id="statusText">Ready</span></span>
  </header>

  <section class="stage">
    <div class="orb-wrap">
      <svg class="ring" viewBox="0 0 196 196" aria-hidden="true">
        <circle class="track" cx="98" cy="98" r="88"></circle>
        <circle class="level" id="levelRing" cx="98" cy="98" r="88"></circle>
      </svg>
      <button class="orb" id="talk" data-mode="idle">Start talking</button>
    </div>
    <p class="hint" id="hint">Hold <kbd>space</kbd> to talk, or tap the circle.</p>
    <label class="handsfree">
      <input type="checkbox" id="handsFree">
      Hands free: keep the mic open between turns
    </label>
  </section>

  <section class="transcript" id="transcript">
    <p class="empty">Nothing said yet. Start talking and the conversation shows up here.</p>
  </section>

  <div class="error" id="error" role="alert"></div>

  <details class="settings">
    <summary>Connection</summary>
    <div class="fields">
      <label class="field">
        Webhook URL
        <input type="text" id="webhook" spellcheck="false">
      </label>
      <label class="field">
        Session ID (the agent remembers everything under this ID)
        <input type="text" id="session" spellcheck="false">
      </label>
      <div class="row">
        <button class="plain" id="newSession">Start a new session</button>
        <button class="plain" id="clear">Clear transcript</button>
        <button class="plain" id="copy">Copy transcript</button>
      </div>
    </div>
  </details>

</main>

<script>
(() => {
  const DEFAULT_WEBHOOK = "https://n8n.aiparagonconsulting.com/webhook/voice-agent";

  const els = {
    talk: document.getElementById("talk"),
    status: document.getElementById("status"),
    statusText: document.getElementById("statusText"),
    hint: document.getElementById("hint"),
    ring: document.getElementById("levelRing"),
    transcript: document.getElementById("transcript"),
    error: document.getElementById("error"),
    webhook: document.getElementById("webhook"),
    session: document.getElementById("session"),
    handsFree: document.getElementById("handsFree"),
    newSession: document.getElementById("newSession"),
    clear: document.getElementById("clear"),
    copy: document.getElementById("copy")
  };

  const RING_LEN = 2 * Math.PI * 88;
  els.ring.style.strokeDasharray = RING_LEN;
  els.ring.style.strokeDashoffset = RING_LEN;

  const LABELS = {
    idle: "Start talking",
    listening: "Stop and send",
    thinking: "Thinking",
    speaking: "Speaking"
  };
  const STATUS = {
    idle: "Ready",
    listening: "Listening",
    thinking: "Thinking",
    speaking: "Speaking",
    error: "Stopped"
  };

  let mode = "idle";
  let stream = null;
  let recorder = null;
  let chunks = [];
  let audioCtx = null;
  let analyser = null;
  let rafId = null;
  let player = null;
  let turns = [];
  let speechSeen = false;
  let silenceStart = 0;
  let hardStopTimer = null;
  let cancelled = false;

  els.webhook.value = DEFAULT_WEBHOOK;
  els.session.value = newSessionId();

  function newSessionId() {
    return "voice-" + Math.random().toString(36).slice(2, 8) + "-" + Date.now().toString(36);
  }

  function setMode(next) {
    mode = next;
    els.talk.dataset.mode = next === "error" ? "idle" : next;
    els.talk.textContent = LABELS[next] || LABELS.idle;
    els.talk.disabled = next === "thinking" || next === "speaking";
    els.status.dataset.mode = next;
    els.statusText.textContent = STATUS[next] || STATUS.idle;

    if (next === "listening") {
      els.ring.style.opacity = "1";
      els.hint.textContent = els.handsFree.checked
        ? "Stop talking and it sends automatically."
        : "Tap again or release space to send.";
    } else {
      els.ring.style.opacity = "0";
      els.ring.style.strokeDashoffset = RING_LEN;
      if (next === "idle") {
        els.hint.innerHTML = 'Hold <kbd>space</kbd> to talk, or tap the circle.';
      } else if (next === "thinking") {
        els.hint.textContent = "Transcribing and writing a reply.";
      } else if (next === "speaking") {
        els.hint.textContent = "Tap the circle to interrupt.";
      }
    }
  }

  function showError(msg) {
    els.error.textContent = msg;
  }
  function clearError() {
    els.error.textContent = "";
  }

  function addTurn(who, text) {
    if (!text) return;
    turns.push({ who, text, at: new Date() });
    render();
  }

  function render() {
    if (!turns.length) {
      els.transcript.innerHTML = '<p class="empty">Nothing said yet. Start talking and the conversation shows up here.</p>';
      return;
    }
    els.transcript.innerHTML = "";
    for (const t of turns) {
      const row = document.createElement("div");
      row.className = "turn";
      row.dataset.who = t.who;

      const who = document.createElement("div");
      who.className = "who";
      who.textContent = t.who === "you" ? "You" : t.who === "agent" ? "Agent" : "Note";
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = t.at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      who.appendChild(time);

      const said = document.createElement("p");
      said.className = "said";
      said.textContent = t.text;

      row.append(who, said);
      els.transcript.appendChild(row);
    }
    els.transcript.lastElementChild.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function pickMime() {
    const options = [
      ["audio/webm;codecs=opus", "webm", "audio/webm"],
      ["audio/webm", "webm", "audio/webm"],
      ["audio/ogg;codecs=opus", "ogg", "audio/ogg"],
      ["audio/mp4", "m4a", "audio/mp4"]
    ];
    for (const [test, ext, clean] of options) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(test)) {
        return { recorderMime: test, ext, mimeType: clean };
      }
    }
    return { recorderMime: "", ext: "webm", mimeType: "audio/webm" };
  }

  async function ensureMic() {
    if (stream && stream.active) return stream;
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.75;
    src.connect(analyser);
    return stream;
  }

  function meter() {
    if (!analyser) return;
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) {
      const v = (buf[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / buf.length);
    const level = Math.min(1, rms * 6);
    els.ring.style.strokeDashoffset = String(RING_LEN * (1 - level));

    if (mode === "listening" && els.handsFree.checked) {
      const now = performance.now();
      if (rms > 0.035) {
        speechSeen = true;
        silenceStart = now;
      } else if (speechSeen && now - silenceStart > 1200) {
        stopListening();
        return;
      }
    }
    rafId = requestAnimationFrame(meter);
  }

  async function startListening() {
    clearError();
    stopPlayback();
    try {
      await ensureMic();
    } catch (err) {
      setMode("error");
      showError(
        err && err.name === "NotAllowedError"
          ? "Microphone access was blocked. Allow the mic for this page in your browser settings, then try again."
          : "No microphone available. Check that one is connected and that this page is served over https or localhost."
      );
      return;
    }

    const { recorderMime, ext, mimeType } = pickMime();
    chunks = [];
    cancelled = false;
    speechSeen = false;
    silenceStart = performance.now();

    try {
      recorder = new MediaRecorder(stream, recorderMime ? { mimeType: recorderMime } : undefined);
    } catch (err) {
      setMode("error");
      showError("This browser cannot record audio. Chrome, Edge or Firefox work best.");
      return;
    }

    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      cancelAnimationFrame(rafId);
      clearTimeout(hardStopTimer);
      if (cancelled) { setMode("idle"); return; }
      const blob = new Blob(chunks, { type: mimeType });
      if (blob.size < 1200) {
        setMode("idle");
        showError("That clip was too short to hear. Hold the button while you speak.");
        return;
      }
      send(blob, mimeType, ext);
    };

    recorder.start();
    setMode("listening");
    meter();
    hardStopTimer = setTimeout(() => { if (mode === "listening") stopListening(); }, 30000);
  }

  function stopListening() {
    if (recorder && recorder.state === "recording") recorder.stop();
  }

  function cancelListening() {
    cancelled = true;
    stopListening();
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = () => reject(new Error("Could not read the recording."));
      reader.readAsDataURL(blob);
    });
  }

  async function send(blob, mimeType, ext) {
    setMode("thinking");
    const url = els.webhook.value.trim();
    if (!url) {
      setMode("error");
      showError("Add your n8n webhook URL under Connection first.");
      return;
    }

    let audio;
    try {
      audio = await blobToBase64(blob);
    } catch (err) {
      setMode("error");
      showError(err.message);
      return;
    }

    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sessionId: els.session.value.trim() || "voice-default",
          audio,
          mimeType,
          ext
        })
      });
    } catch (err) {
      setMode("error");
      showError("Could not reach the webhook. Check the URL, that the workflow is active, and that the browser is allowed to call it.");
      return;
    }

    if (!res.ok) {
      setMode("error");
      const detail = res.status === 404
        ? "n8n returned 404. The workflow may be inactive, or the path may not match."
        : "n8n returned " + res.status + ". Open the execution log in n8n to see which node failed.";
      showError(detail);
      return;
    }

    let data;
    try {
      data = await res.json();
    } catch (err) {
      setMode("error");
      showError("The webhook replied with something that was not JSON. Check the Respond to Client node.");
      return;
    }

    if (data.userText) addTurn("you", data.userText);
    if (data.replyText) addTurn("agent", data.replyText);
    if (!data.userText && !data.replyText) addTurn("note", "The workflow ran but sent back no text.");

    if (data.audio) {
      playReply(data.audio, data.audioMimeType || "audio/mpeg");
    } else {
      finishTurn();
    }
  }

  function playReply(base64, type) {
    stopPlayback();
    setMode("speaking");
    player = new Audio("data:" + type + ";base64," + base64);
    player.onended = finishTurn;
    player.onerror = () => {
      showError("The reply audio would not play, but the text is above.");
      finishTurn();
    };
    player.play().catch(() => {
      showError("Your browser blocked autoplay. Tap the circle once, then try again.");
      finishTurn();
    });
  }

  function stopPlayback() {
    if (player) {
      player.pause();
      player.onended = null;
      player = null;
    }
  }

  function finishTurn() {
    setMode("idle");
    if (els.handsFree.checked) setTimeout(() => { if (mode === "idle") startListening(); }, 350);
  }

  els.talk.addEventListener("click", () => {
    if (mode === "listening") stopListening();
    else if (mode === "speaking") { stopPlayback(); setMode("idle"); }
    else if (mode !== "thinking") startListening();
  });

  let spaceHeld = false;
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.repeat) return;
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    e.preventDefault();
    if (mode === "idle") { spaceHeld = true; startListening(); }
  });
  document.addEventListener("keyup", (e) => {
    if (e.code !== "Space" || !spaceHeld) return;
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    e.preventDefault();
    spaceHeld = false;
    if (mode === "listening") stopListening();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && mode === "listening") cancelListening();
  });

  els.handsFree.addEventListener("change", () => {
    if (els.handsFree.checked && mode === "idle") startListening();
    if (!els.handsFree.checked && mode === "listening") stopListening();
  });

  els.newSession.addEventListener("click", () => {
    els.session.value = newSessionId();
    turns = [];
    render();
    clearError();
    addTurn("note", "New session. The agent has forgotten the earlier conversation.");
  });

  els.clear.addEventListener("click", () => {
    turns = [];
    render();
    clearError();
  });

  els.copy.addEventListener("click", async () => {
    const text = turns
      .map((t) => (t.who === "you" ? "You" : t.who === "agent" ? "Agent" : "Note") + ": " + t.text)
      .join("\n");
    try {
      await navigator.clipboard.writeText(text);
      els.copy.textContent = "Copied";
      setTimeout(() => (els.copy.textContent = "Copy transcript"), 1400);
    } catch (err) {
      showError("Copying was blocked. Select the transcript and copy it manually.");
    }
  });

  setMode("idle");
  render();
})();
</script>
</body>
</html>
