
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#4F46E5;--accent-light:#EEF2FF;--text:#111827;--muted:#6B7280;--border:#E5E7EB;--card:#fff;--bg:#F9FAFB}
body{font-family:'DM Sans',system-ui,sans-serif}

.wrap{padding:2.5rem 0 1rem}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:.4rem}
.headline{text-align:center;font-size:22px;font-weight:600;color:var(--text);margin-bottom:.35rem}
.subhead{text-align:center;font-size:14px;color:var(--muted);margin-bottom:2rem}

/* WHEEL */
.wheel-section{display:flex;flex-direction:column;align-items:center;gap:1.5rem;margin-bottom:2.5rem}
.wheel-outer{position:relative;width:320px;height:320px;flex-shrink:0}
.wheel-svg{width:100%;height:100%}
.wheel-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.center-label{font-size:12px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.center-name{font-size:15px;font-weight:700;color:var(--text);margin-top:2px;text-align:center;max-width:80px;line-height:1.2}

/* CATEGORY PILLS */
.cat-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:1.25rem}
.cat-pill{font-size:12px;padding:6px 14px;border-radius:999px;border:.5px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;background:var(--card)}
.cat-pill:hover,.cat-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* TOOL GRID */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:2rem}
.tool-card{background:var(--card);border:.5px solid var(--border);border-radius:14px;padding:14px 12px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:8px}
.tool-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(79,70,229,.1)}
.tool-card.active-card{border-color:var(--accent);border-width:1.5px;background:var(--accent-light)}
.tool-top{display:flex;align-items:center;gap:8px}
.tool-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tool-name{font-size:13px;font-weight:600;color:var(--text)}
.tool-cat{font-size:11px;color:var(--muted)}
.tool-desc{font-size:12px;color:var(--muted);line-height:1.4}

/* CASE STUDY PANEL */
.panel{background:var(--card);border:.5px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:2rem;display:none}
.panel.open{display:block}
.panel-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:1rem}
.panel-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.panel-title{font-size:17px;font-weight:700;color:var(--text)}
.panel-cat-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;margin-top:4px}
.close-x{background:none;border:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:1rem 0}
.metric-box{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.metric-val{font-size:20px;font-weight:700;color:var(--accent)}
.metric-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.case-section{margin-top:.75rem}
.case-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.case-text{font-size:13px;color:var(--text);line-height:1.5}

/* SCROLL TRACK */
.track-wrap{overflow:hidden;width:100%;margin-bottom:.5rem}
.track{display:flex;gap:14px}
.mini-chip{display:flex;align-items:center;gap:7px;padding:8px 14px;background:var(--card);border:.5px solid var(--border);border-radius:999px;flex-shrink:0;cursor:pointer;transition:all .15s}
.mini-chip:hover{border-color:var(--accent);color:var(--accent)}
.mini-chip span{font-size:12px;font-weight:500;color:var(--text)}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<div class="wrap">
  <p class="eyebrow">AI tools we work with</p>
  <p class="headline">Tools we use to build real AI systems</p>
  <p class="subhead">Click a category to explore by use case — or click any tool for a real client example</p>

  <div class="cat-pills" id="cat-pills"></div>

  <div class="panel" id="panel">
    <div class="panel-top">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div class="panel-icon" id="p-icon"></div>
        <div>
          <div class="panel-title" id="p-title"></div>
          <div class="panel-cat-badge" id="p-badge"></div>
        </div>
      </div>
      <button class="close-x" onclick="closePanel()">×</button>
    </div>
    <div class="metrics" id="p-metrics"></div>
    <div class="case-section">
      <div class="case-label">Challenge</div>
      <div class="case-text" id="p-prob"></div>
    </div>
    <div class="case-section" style="margin-top:.75rem">
      <div class="case-label">How we used it</div>
      <div class="case-text" id="p-sol"></div>
    </div>
    <div class="case-section" style="margin-top:.75rem">
      <div class="case-label">Outcome</div>
      <div class="case-text" id="p-res"></div>
    </div>
  </div>

  <div class="tool-grid" id="tool-grid"></div>

  <p class="eyebrow" style="margin-bottom:.75rem">All tools at a glance</p>
  <div class="track-wrap"><div class="track" id="scroll-track"></div></div>
</div>

<script>
const CATS = [
  {id:"all", label:"All tools", color:"#4F46E5", bg:"#EEF2FF"},
  {id:"lead", label:"Lead generation", color:"#0F6E56", bg:"#E1F5EE"},
  {id:"automation", label:"Workflow automation", color:"#854F0B", bg:"#FAEEDA"},
  {id:"knowledge", label:"Knowledge & research", color:"#3C3489", bg:"#EEEDFE"},
  {id:"content", label:"Content & comms", color:"#993C1D", bg:"#FAECE7"},
  {id:"crm", label:"CRM & pipeline", color:"#185FA5", bg:"#E6F1FB"},
];

const TOOLS = [
  {name:"HubSpot", icon:"🎯", bg:"#FAECE7", cat:"crm", catLabel:"CRM & pipeline",
   metrics:[{v:"3×",l:"More pipeline visibility"},{v:"40%",l:"Faster follow-up"},{v:"100%",l:"Contact auto-logging"}],
   prob:"A financial services firm had leads scattered across email threads, spreadsheets, and sticky notes — no central view of who was in the pipeline or where each conversation stood.",
   sol:"We implemented HubSpot as the firm's central CRM, built automated deal stage workflows, and connected it to their website contact forms so every inbound lead landed directly into a tracked pipeline.",
   res:"The team went from zero pipeline visibility to a fully structured process in two weeks. Follow-up response time dropped by 40% and no lead fell through the cracks."},
  {name:"ChatGPT", icon:"💬", bg:"#E1F5EE", cat:"content", catLabel:"Content & comms",
   metrics:[{v:"10h",l:"Saved per week"},{v:"5×",l:"Content output"},{v:"2 days",l:"Proposal turnaround"}],
   prob:"A professional services founder was spending 10+ hours a week writing proposals, follow-up emails, and LinkedIn posts — all from scratch, all manually.",
   sol:"We built a custom GPT trained on their tone, service offerings, and client personas. It drafts proposals, emails, and social posts with one prompt, ready for human review.",
   res:"Content output increased 5× with no new hires. Proposals that took two days now take under an hour. The founder shifted that recovered time into business development."},
  {name:"n8n", icon:"⚙️", bg:"#EAF3DE", cat:"automation", catLabel:"Workflow automation",
   metrics:[{v:"60%",l:"Ops time reclaimed"},{v:"0",l:"Manual data entry"},{v:"24/7",l:"Automated uptime"}],
   prob:"A growing consulting firm was manually moving data between five different tools every day — CRM updates, email triggers, document filing, and client notifications all done by hand.",
   sol:"We built an n8n automation layer connecting their CRM, email system, cloud storage, and Slack. When a new client is added, the entire onboarding sequence fires automatically.",
   res:"Over 60% of daily operational tasks were eliminated. The team no longer does any manual data entry between systems, and new client onboarding runs in the background without human intervention."},
  {name:"Perplexity", icon:"🔍", bg:"#FAEEDA", cat:"knowledge", catLabel:"Knowledge & research",
   metrics:[{v:"80%",l:"Research time cut"},{v:"Same day",l:"Client intel ready"},{v:"3×",l:"Deeper insights"}],
   prob:"Pre-meeting research on a new prospect used to take half a day — manually searching news, LinkedIn, company sites, and industry reports to build context.",
   sol:"We integrated Perplexity into the pre-meeting prep workflow. With a single prompt, it surfaces company news, industry trends, recent executive moves, and competitive landscape in minutes.",
   res:"Research that took four hours now takes under 45 minutes. Client meetings start with sharper, more specific insights — making early conversations noticeably more valuable to prospects."},
  {name:"Make", icon:"🔗", bg:"#FAECE7", cat:"automation", catLabel:"Workflow automation",
   metrics:[{v:"No-code",l:"Zero dev needed"},{v:"200+",l:"Apps connected"},{v:"15min",l:"Setup per trigger"}],
   prob:"A small business needed automation across tools but had no technical staff and couldn't justify hiring a developer for basic integration work.",
   sol:"We used Make (formerly Integromat) to visually connect their tools — lead forms to CRM, CRM to email sequences, form fills to Google Sheets — all without writing a line of code.",
   res:"The owner now manages their own automation flows without any technical support. New integrations that would have required a freelancer now take 15 minutes to set up independently."},
  {name:"Claude", icon:"🤖", bg:"#EEEDFE", cat:"knowledge", catLabel:"Knowledge & research",
   metrics:[{v:"90%",l:"Draft quality"},{v:"1 hr",l:"Assessment creation"},{v:"Consistent",l:"Output format"}],
   prob:"Creating a strategic AI assessment for each client took two to three days of research, synthesis, and writing — making it hard to scale beyond a small number of clients per month.",
   sol:"We built a Claude-powered workflow that takes a discovery call transcript, researches the company, and generates a structured assessment draft using a proven template — ready for human review.",
   res:"Assessment creation went from days to under an hour. Draft quality is consistently high enough that edits take 30 minutes rather than hours, allowing the team to serve more clients without sacrificing quality."},
  {name:"Notion AI", icon:"📝", bg:"#F1EFE8", cat:"knowledge", catLabel:"Knowledge & research",
   metrics:[{v:"1 place",l:"All knowledge lives"},{v:"Instant",l:"Answer retrieval"},{v:"New hire",l:"Ramp-up cut 50%"}],
   prob:"A firm's internal knowledge was scattered across email, old documents, and individual memory — new team members took months to get up to speed and answers were hard to find.",
   sol:"We built a Notion-based knowledge base with AI-powered search, organizing SOPs, client history, service frameworks, and templates in one structured, searchable workspace.",
   res:"New team members onboard in half the time. Anyone on the team can find answers in seconds rather than emailing colleagues or digging through old files."},
  {name:"GoHighLevel", icon:"📊", bg:"#E6F1FB", cat:"crm", catLabel:"CRM & pipeline",
   metrics:[{v:"All-in-one",l:"CRM + email + SMS"},{v:"White-label",l:"Agency ready"},{v:"Auto",l:"Nurture sequences"}],
   prob:"An agency needed a single platform to manage client pipelines, automated follow-up, email campaigns, and appointment booking without stitching together five separate tools.",
   sol:"We implemented GoHighLevel as the agency's all-in-one operating system — pipeline tracking, automated SMS and email nurture sequences, booking integrations, and reporting in one place.",
   res:"The agency replaced four separate subscriptions with one platform. Automated nurture sequences now run in the background, and no lead goes uncontacted after an initial inquiry."},
  {name:"Vapi", icon:"🎙️", bg:"#FBEAF0", cat:"lead", catLabel:"Lead generation",
   metrics:[{v:"24/7",l:"Lead qualification"},{v:"2 min",l:"Avg call time"},{v:"0",l:"Missed inbound calls"}],
   prob:"A business was missing inbound calls after hours and had no way to qualify leads before a human picked up the phone, resulting in wasted time on poor-fit calls.",
   sol:"We deployed a Vapi AI voice agent that answers inbound calls 24/7, qualifies the lead with four key questions, and routes high-fit prospects directly to a calendar booking link.",
   res:"Zero missed inbound calls. High-fit leads book directly without waiting for a callback, and the team only picks up pre-qualified conversations — no more cold screening calls."},
  {name:"Zapier", icon:"⚡", bg:"#FAEEDA", cat:"automation", catLabel:"Workflow automation",
   metrics:[{v:"5 min",l:"Integration setup"},{v:"6000+",l:"Apps supported"},{v:"Set & forget",l:"Reliability"}],
   prob:"A business needed simple, reliable connections between their everyday tools — calendar, email, CRM, Slack — but didn't want to maintain complex automation infrastructure.",
   sol:"We used Zapier to wire together the most common trigger-action pairs: new form fill → CRM contact, new booking → Slack notification, new invoice paid → folder created in Drive.",
   res:"Day-to-day workflows run automatically with zero maintenance. The team gains back 30–60 minutes daily that was previously spent on manual copy-paste tasks between apps."},
  {name:"Gemini", icon:"✦", bg:"#E6F1FB", cat:"content", catLabel:"Content & comms",
   metrics:[{v:"Native",l:"Google Workspace"},{v:"Real-time",l:"Docs & Sheets AI"},{v:"Unified",l:"One platform"}],
   prob:"A team already living in Google Workspace was using separate AI tools for writing and analysis, then manually moving outputs back into Docs and Sheets.",
   sol:"We activated Gemini across their Google Workspace, enabling AI writing, summarization, and data analysis directly inside the tools they already use every day.",
   res:"The team eliminated context-switching between AI tools and their work. AI assistance is now embedded directly in their existing workflow — no extra apps, no copy-pasting."},
  {name:"Salesforce", icon:"☁️", bg:"#E6F1FB", cat:"crm", catLabel:"CRM & pipeline",
   metrics:[{v:"Enterprise",l:"Scale & compliance"},{v:"Full audit",l:"Trail on all data"},{v:"Custom",l:"Industry workflows"}],
   prob:"A regulated financial services firm needed a CRM with enterprise-grade data controls, audit trails, and the ability to build custom workflows for a compliance-heavy sales process.",
   sol:"We implemented Salesforce with custom objects for their compliance workflow, automated approval routing, and integration with their document management system.",
   res:"The firm met their compliance requirements with full data audit trails while the sales team gained a customized pipeline that mirrors their actual process — not a generic one."},
];

let activecat = "all";
let activeTool = null;

function renderPills() {
  document.getElementById("cat-pills").innerHTML = CATS.map(c=>`
    <div class="cat-pill${activecat===c.id?" active":""}" onclick="setcat('${c.id}')">${c.label}</div>
  `).join("");
}

function renderGrid() {
  const filtered = activecat==="all" ? TOOLS : TOOLS.filter(t=>t.cat===activecat);
  document.getElementById("tool-grid").innerHTML = filtered.map((t,i)=>`
    <div class="tool-card${activeTool===t.name?" active-card":""}" onclick="openTool('${t.name}')">
      <div class="tool-top">
        <div class="tool-icon" style="background:${t.bg}">${t.icon}</div>
        <div>
          <div class="tool-name">${t.name}</div>
          <div class="tool-cat">${t.catLabel}</div>
        </div>
      </div>
      <div class="tool-desc">${t.metrics[0].v} ${t.metrics[0].l.toLowerCase()}</div>
    </div>
  `).join("");
}

function setcat(id) {
  activecat = id;
  activeTool = null;
  closePanel();
  renderPills();
  renderGrid();
}

function openTool(name) {
  const t = TOOLS.find(x=>x.name===name);
  if(!t) return;
  activeTool = name;
  renderGrid();

  const cat = CATS.find(c=>c.id===t.cat)||CATS[0];
  document.getElementById("p-icon").textContent = t.icon;
  document.getElementById("p-icon").style.background = t.bg;
  document.getElementById("p-title").textContent = t.name;
  document.getElementById("p-badge").textContent = t.catLabel;
  document.getElementById("p-badge").style.background = cat.bg;
  document.getElementById("p-badge").style.color = cat.color;
  document.getElementById("p-metrics").innerHTML = t.metrics.map(m=>`
    <div class="metric-box">
      <div class="metric-val">${m.v}</div>
      <div class="metric-lbl">${m.l}</div>
    </div>
  `).join("");
  document.getElementById("p-prob").textContent = t.prob;
  document.getElementById("p-sol").textContent = t.sol;
  document.getElementById("p-res").textContent = t.res;
  document.getElementById("panel").classList.add("open");
  document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function closePanel() {
  activeTool = null;
  document.getElementById("panel").classList.remove("open");
  renderGrid();
}

function buildScrollTrack() {
  let html = "";
  for(let i=0;i<6;i++) TOOLS.forEach(t=>{
    html += `<div class="mini-chip" onclick="openTool('${t.name}')"><span>${t.icon}</span><span>${t.name}</span></div>`;
  });
  document.getElementById("scroll-track").innerHTML = html;
  let pos=0, speed=0.4;
  const track = document.getElementById("scroll-track");
  const firstW = () => track.scrollWidth/6;
  track.addEventListener("mouseenter",()=>speed=0);
  track.addEventListener("mouseleave",()=>speed=0.4);
  function go(){
    pos-=speed;
    if(Math.abs(pos)>=firstW()) pos=0;
    track.style.transform=`translateX(${pos}px)`;
    requestAnimationFrame(go);
  }
  go();
}

renderPills();
renderGrid();
buildScrollTrack();
</script>
