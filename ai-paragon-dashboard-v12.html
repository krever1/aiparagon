<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Paragon — Intelligence Dashboard</title>
<link rel="icon" href="https://www.aiparagonconsulting.com/logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.min.js"></script>
<style>
  :root{
    --bg:#F5F2EC; --cream:#EDE9DF; --navy:#1E3A5F; --navy-deep:#162C49;
    --gold:#C9A84C; --gold-soft:#F3EBD7; --navy-soft:#E7EDF5;
    --ink:#22293A; --muted:#6E6A5E; --line:#E6E1D5; --white:#FFFFFF;
    --good:#3E7A5B; --good-soft:#E2EEE7; --warn:#B07A2A; --bad:#A94438;
    --shadow:0 1px 2px rgba(30,58,95,.05),0 10px 30px rgba(30,58,95,.08);
    --shadow-sm:0 1px 2px rgba(30,58,95,.04),0 4px 12px rgba(30,58,95,.05);
    --r:20px; --r-sm:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:15px}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;line-height:1.5}
  /* ---------- layout ---------- */
  .app{display:flex;min-height:100vh}
  .main>*{max-width:1380px}
  .sidebar{width:250px;flex-shrink:0;background:var(--white);border-right:1px solid var(--line);
    padding:26px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
  .main{flex:1;min-width:0;padding:26px 36px 80px}
  @media(max-width:820px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line)}
    .main{padding:18px 14px 60px}
  }
  /* ---------- brand ---------- */
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:0 8px}
  .brand img{width:34px;height:34px;object-fit:contain}
  .brand .word{font-family:Georgia,'Times New Roman',serif;font-size:1.14rem;font-weight:700;letter-spacing:.01em;color:var(--navy)}
  .brand .word em{font-style:normal;color:var(--gold)}
  /* ---------- engine switcher ---------- */
  .engines{display:flex;flex-direction:column;gap:3px;margin-bottom:14px}
  .engines button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:11px 12px;border-radius:var(--r-sm);font-size:.85rem;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background .15s}
  .engines button:hover{background:var(--bg)}
  .engines button.active{background:var(--navy);color:#fff;box-shadow:var(--shadow-sm)}
  .engines button .tag{font-size:.6rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gold)}
  .engines button.active .tag{color:var(--gold)}
  .engines button.soon{opacity:.55}
  .engines button.soon .tag{color:var(--muted)}
  /* ---------- nav ---------- */
  .navlabel{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 10px 8px}
  .nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 12px;border-radius:var(--r-sm);font-size:.9rem;font-weight:500;color:var(--ink);transition:background .15s}
  .nav .n{font-size:.66rem;font-weight:700;background:var(--gold);color:#fff;border-radius:99px;padding:1px 8px}
  .nav button:hover{background:var(--bg)}
  .nav button.active{background:var(--gold-soft);color:var(--navy);font-weight:650}
  .side-foot{margin-top:auto;background:var(--bg);border-radius:14px;padding:14px;font-size:.72rem;color:var(--muted);line-height:1.5}
  /* ---------- topbar ---------- */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
  .topbar .spacer{flex:1}
  .sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:7px;background:var(--white);border-radius:99px;padding:9px 16px;box-shadow:var(--shadow-sm)}
  .sync .dot{width:8px;height:8px;border-radius:99px;background:var(--good)}
  .userchip{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:99px;
    padding:6px 16px 6px 6px;box-shadow:var(--shadow-sm);font-size:.85rem;font-weight:600;color:var(--navy)}
  .userchip .av{width:32px;height:32px;border-radius:99px;background:var(--gold-soft);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700}
  /* ---------- page head as hero ---------- */
  .page-head{background:linear-gradient(115deg,var(--navy) 0%,var(--navy-deep) 70%);border-radius:22px;
    padding:28px 32px;color:#fff;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
    gap:16px;margin-bottom:26px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .page-head::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;
    border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.26),transparent 65%);pointer-events:none}
  .page-head>*{position:relative;z-index:1}
  h1.page{font-family:Georgia,serif;font-size:1.7rem;font-weight:700;color:#fff;letter-spacing:-.01em}
  .page-sub{color:#C7D1DF;margin-top:6px;font-size:.88rem;max-width:560px}
  .page-head .chip{background:rgba(255,255,255,.12);color:#E8EDF4}
  .page-head .chip b{color:var(--gold)}
  .page-head .lineage{background:rgba(255,255,255,.12);color:#E8EDF4;box-shadow:none}
  .page-head .lineage b{color:var(--gold)}
  .page-head .controls label{color:#C7D1DF}
  /* ---------- controls ---------- */
  select,input[type=search]{font:inherit;font-size:.86rem;padding:9px 14px;border:none;border-radius:var(--r-sm);background:var(--white);color:var(--ink);box-shadow:var(--shadow-sm)}
  select:focus,input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .controls label{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-right:2px}
  /* ---------- cards ---------- */
  .grid{display:grid;gap:20px}
  .grid.cols3{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
  .card{background:var(--white);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 3px 6px rgba(30,58,95,.07),0 16px 40px rgba(30,58,95,.12)}
  .card h3{font-family:Georgia,serif;font-size:1.1rem;color:var(--navy);margin-bottom:2px}
  .card .agent-kind{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:4px}
  .statline{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:.71rem;background:var(--bg);padding:4px 11px;border-radius:99px;color:var(--muted)}
  .chip b{color:var(--navy);font-weight:700}
  .datestamp{font-size:.76rem;color:var(--muted);margin-top:10px;display:flex;gap:8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:99px;display:inline-block}
  .dot.fresh{background:var(--good)} .dot.stale{background:var(--warn)} .dot.old{background:var(--bad)} .dot.none{background:var(--line)}
  .card .go{margin-top:16px}
  .go button{all:unset;cursor:pointer;font-size:.8rem;font-weight:650;color:var(--navy);background:var(--gold-soft);padding:8px 16px;border-radius:10px;transition:background .15s,color .15s}
  .go button:hover{background:var(--gold);color:#fff}
  /* ---------- pills ---------- */
  .pill{font-size:.64rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
  .pill.high{background:var(--gold-soft);color:#7A5E12}
  .pill.medium{background:var(--cream);color:var(--muted)}
  .pill.low{background:var(--bg);color:var(--muted)}
  .pill.pending{background:var(--gold-soft);color:#7A5E12}
  .pill.approved{background:var(--good-soft);color:var(--good)}
  .pill.rejected{background:#F3E2DF;color:var(--bad)}
  .pill.posted{background:var(--navy-soft);color:var(--navy)}
  .pill.platform{background:var(--navy);color:#fff}
  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:8px;margin:20px 0 18px;flex-wrap:wrap}
  .tabs button{all:unset;cursor:pointer;padding:9px 18px;border-radius:99px;font-size:.84rem;font-weight:600;color:var(--muted);background:var(--white);box-shadow:var(--shadow-sm);transition:all .15s}
  .tabs button:hover{color:var(--navy)}
  .tabs button.active{background:var(--navy);color:#fff}
  /* ---------- brief rendering ---------- */
  .brief{background:var(--white);border-radius:var(--r);padding:32px 38px;max-width:920px;box-shadow:var(--shadow)}
  .brief h1{font-family:Georgia,serif;font-size:1.5rem;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:12px}
  .brief h2{font-family:Georgia,serif;font-size:1.12rem;color:var(--navy);margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .brief h3{font-size:.98rem;color:var(--ink);margin:16px 0 6px}
  .brief p{margin:8px 0}
  .brief ul,.brief ol{margin:8px 0 8px 22px}
  .brief li{margin:4px 0}
  .brief a{color:var(--navy);text-decoration:underline;text-decoration-color:var(--gold)}
  .brief table{border-collapse:collapse;width:100%;margin:12px 0;font-size:.86rem}
  .brief th,.brief td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  .brief th{background:var(--cream);font-weight:650}
  .brief hr{border:none;border-top:1px solid var(--line);margin:20px 0}
  .brief em{color:var(--muted)}
  /* ---------- tables ---------- */
  .tbl{width:100%;border-collapse:collapse;background:var(--white);font-size:.85rem}
  .tbl th{background:var(--cream);text-align:left;padding:11px 14px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tbl td{padding:13px 14px;border-top:1px solid var(--line);vertical-align:top}
  .tbl tr:hover td{background:var(--bg)}
  .tbl a{color:var(--navy)}
  .tbl-wrap{overflow-x:auto;border-radius:var(--r);box-shadow:var(--shadow)}
  /* ---------- draft cards ---------- */
  .draft{background:var(--white);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .draft .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .draft .who{font-weight:700;color:var(--navy)}
  .draft .text{white-space:pre-wrap;font-size:.88rem;background:var(--bg);border-radius:var(--r-sm);padding:13px 15px;margin:8px 0;line-height:1.5}
  .draft .meta{font-size:.72rem;color:var(--muted)}
  /* ---------- ad cards ---------- */
  .adgrid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .adcard{background:var(--white);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .adcard:hover{transform:translateY(-3px);box-shadow:0 3px 6px rgba(30,58,95,.07),0 16px 40px rgba(30,58,95,.12)}
  .adcard img{width:100%;max-height:230px;object-fit:cover;background:var(--cream)}
  .adcard .body{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .adcard .hook{font-size:.9rem;font-weight:600;color:var(--ink)}
  .adcard .bodytext{font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .adcard .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.74rem;color:var(--muted)}
  .longevity{font-weight:700;color:var(--good)}
  /* ---------- notices ---------- */
  .notice{border-left:4px solid var(--gold);background:var(--white);border-radius:var(--r-sm);padding:16px 18px;margin:14px 0;font-size:.9rem;box-shadow:var(--shadow-sm)}
  .notice.err{border-left-color:var(--bad)}
  .notice code{background:var(--cream);padding:1px 6px;border-radius:5px;font-size:.82rem}
  .empty{padding:52px 20px;text-align:center;color:var(--muted);background:var(--white);border-radius:var(--r);box-shadow:var(--shadow-sm)}
  .empty .big{font-family:Georgia,serif;font-size:1.1rem;color:var(--navy);margin-bottom:6px}
  .loading{color:var(--muted);font-size:.9rem;padding:20px 0}
  .lineage{font-size:.78rem;color:var(--muted);background:var(--white);border-radius:99px;padding:8px 15px;display:inline-block;margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .lineage b{color:var(--navy)}
  section.block{margin-bottom:38px}
  section.block>h2{font-family:Georgia,serif;font-size:1.15rem;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:10px}
  section.block>h2 .count{font-family:Inter,sans-serif;font-size:.7rem;background:var(--gold-soft);color:#7A5E12;border-radius:99px;padding:3px 10px;font-weight:700}

  /* ---------- redesign: hero extras ---------- */
  .page-head .eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .hero-cta{all:unset;cursor:pointer;background:var(--gold);color:var(--navy-deep);font-weight:700;font-size:.85rem;padding:12px 22px;border-radius:12px;white-space:nowrap;transition:opacity .15s}
  .hero-cta:hover{opacity:.88}
  /* ---------- redesign: topbar search ---------- */
  .search{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;background:var(--white);border-radius:99px;padding:3px 8px 3px 18px;box-shadow:var(--shadow-sm)}
  .search svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
  .search input{border:none;box-shadow:none;flex:1;padding:9px 6px;background:transparent;font:inherit;font-size:.88rem;color:var(--ink)}
  .search input:focus{outline:none}
  /* ---------- redesign: view pills ---------- */
  .views{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
  .views:empty{display:none}
  .views button{all:unset;cursor:pointer;padding:9px 18px;border-radius:99px;font-size:.84rem;font-weight:600;color:var(--muted);background:var(--white);box-shadow:var(--shadow-sm);transition:all .15s}
  .views button:hover{color:var(--navy)}
  .views button.active{background:var(--navy);color:#fff}
  /* ---------- redesign: agent cards ---------- */
  .card.agent{display:flex;flex-direction:column;gap:12px}
  .agent-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .agent .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.25rem}
  .ic.a1{background:var(--gold-soft)} .ic.a2{background:var(--navy-soft)} .ic.a3{background:var(--good-soft)}
  .fresh{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--muted);margin-top:4px}
  .card.agent .go{margin-top:auto}
  .card.agent .datestamp{margin-top:0}
  /* ---------- redesign: overview two-column ---------- */
  .cols{display:grid;grid-template-columns:1.65fr 1fr;gap:20px;align-items:start;margin-top:30px}
  @media(max-width:1080px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--white);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .panel-head h2{font-family:Georgia,serif;font-size:1.12rem;color:var(--navy);display:flex;align-items:center;gap:10px}
  .panel-head .count{font-size:.7rem;background:var(--gold-soft);color:#7A5E12;border-radius:99px;padding:3px 10px;font-weight:700;font-family:Inter,sans-serif}
  .panel-head a{font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer}
  .panel-head a:hover{color:var(--navy)}
  .item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .item:last-child{border-bottom:none;padding-bottom:0}
  .srcav{width:40px;height:40px;border-radius:12px;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:var(--navy)}
  .item .txt{flex:1;min-width:0}
  .item .txt p{font-size:.87rem;line-height:1.45}
  .item .txt small{color:var(--muted);font-size:.74rem}
  .brief-teaser{border-left:3px solid var(--gold);padding-left:16px;margin-bottom:10px}
  .brief-teaser h4{font-family:Georgia,serif;font-size:.95rem;color:var(--navy);margin-bottom:4px}
  .brief-teaser p{font-size:.83rem;color:var(--muted)}
  .qdraft{background:var(--bg);border-radius:14px;padding:15px 16px;margin-bottom:12px}
  .qdraft:last-child{margin-bottom:0}
  .qdraft .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .qdraft .who{font-size:.85rem;font-weight:700;color:var(--navy)}
  .qbody{font-size:.82rem;color:var(--ink);background:var(--white);border-radius:10px;padding:11px 13px;margin-bottom:10px;line-height:1.5;max-height:150px;overflow-y:auto}
  .qbody::-webkit-scrollbar{width:6px}
  .qbody::-webkit-scrollbar-thumb{background:var(--cream);border-radius:99px}
  .qdraft .actions{display:flex;gap:8px}
  .qmeta{font-size:.7rem;color:var(--muted);margin-top:8px}
  /* ---------- redesign: buttons ---------- */
  .btn{all:unset;cursor:pointer;font-size:.76rem;font-weight:700;padding:7px 14px;border-radius:9px;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn.ok{background:var(--good);color:#fff}
  .btn.no{background:var(--white);color:var(--bad);box-shadow:inset 0 0 0 1px var(--line)}
  .btn.navy{background:var(--navy);color:#fff}
  .btn.ghost{background:var(--white);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}


  /* ---------- anchored comments ---------- */
  .brief-wrap{display:flex;gap:18px;align-items:flex-start}
  .brief-main{flex:1;min-width:0;position:relative}
  .c-rail{width:290px;flex-shrink:0;position:relative;min-height:60px}
  @media(max-width:1100px){.brief-wrap{flex-direction:column}.c-rail{width:100%;position:static}.c-card{position:static !important;margin-bottom:10px}}
  .brief [data-cidx]{border-radius:6px;transition:background .15s;cursor:pointer}
  .brief [data-cidx]:hover{background:#F6F0DC;box-shadow:0 0 0 6px #F6F0DC}
  .brief [data-cidx].hl{background:#FBF2D8;box-shadow:0 0 0 6px #FBF2D8;border-right:3px solid var(--gold)}
  .brief [data-cidx].hl-active{background:#F6E7B8;box-shadow:0 0 0 6px #F6E7B8}
  .c-card{position:absolute;left:0;right:0;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 4px 16px rgba(30,58,95,.08);font-size:.84rem}
  .c-card .c-anchor{color:var(--muted);font-size:.72rem;font-style:italic;border-left:3px solid var(--gold);padding-left:8px;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c-card .c-msg{margin-bottom:8px}
  .c-card .c-msg .c-who{font-size:.76rem}
  .c-card .c-msg .c-who b{color:var(--navy)}
  .c-card .c-reply{margin-left:12px;border-left:2px solid var(--cream);padding-left:10px}
  .c-card input{width:100%;font:inherit;font-size:.82rem;padding:7px 10px;border:1px solid var(--line);border-radius:7px;margin-top:6px}
  .c-card .c-actions{display:flex;gap:10px;margin-top:4px}
  .c-card .c-actions a{font-size:.76rem;color:var(--navy);cursor:pointer;font-weight:650}
  .pencil-btn{position:absolute;top:14px;right:14px;z-index:5;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;color:var(--navy);font-weight:650;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .pencil-btn:hover{background:var(--cream)}
  .score-btn{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:650;color:var(--navy);background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:2px 10px;cursor:pointer}
  .score-btn:hover{background:#EFE5C8}
  .editing-bar{position:sticky;bottom:12px;display:flex;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.12);margin-top:12px;align-items:center;z-index:6}


  /* ---------- brief formatting upgrades ---------- */
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0 18px}
  .meta-grid .mg-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:750;margin-bottom:2px}
  .meta-grid .mg-value{font-size:.86rem;font-weight:600;color:var(--ink);line-height:1.35}
  .shift-card{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--white)}

const cache = {};

function asObj(v){ if(typeof v === "string"){ try{ return JSON.parse(v); }catch(e){ return {}; } } return (v && typeof v === "object") ? v : {}; }

async function sbPatch(path, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: "PATCH",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      Prefer: "return=representation"
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const t = await res.text();
    const err = new Error(`${res.status}`); err.body = t; err.status = res.status; throw err;
  }
  return res.json();
}

async function setDraftStatus(id, status, btn){
  const card = btn.closest(".draft");
  card.querySelectorAll("button").forEach(b=>b.disabled=true);
  try{
    const rows = await sbPatch(`engagement_drafts?id=eq.${encodeURIComponent(id)}`, { status });
    if(!rows.length) throw Object.assign(new Error("0 rows updated"), {status: 403, body: "row-level security"});
    Object.keys(cache).forEach(k=>{ if(k.startsWith("engagement_drafts")) delete cache[k]; });
    renderIntel();
  }catch(e){
    card.querySelectorAll("button").forEach(b=>b.disabled=false);
    const denied = e.status===401 || e.status===403 || (e.body||"").includes("row-level security") || (e.body||"").includes("permission");
    showAlert(denied
      ? "Supabase is blocking the update. Run the engagement_drafts update policy from the setup SQL."
      : "Update failed: " + (e.message || e), "Update failed");
  }
}


async function sbPost(path, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json", Prefer: "return=representation" },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t = await res.text(); const err = new Error(`${res.status}`); err.body=t; err.status=res.status; throw err; }
  return res.json();
}
function whoAmI(){ return sessionStorage.getItem("aip_user") || "Team"; }

function showAlert(msg, title){
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:fixed;inset:0;z-index:998;background:rgba(30,40,60,.45);display:flex;align-items:center;justify-content:center;padding:20px";

    <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn navy" id="alertOk">OK</button></div></div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.querySelector("#alertOk").onclick = close;
  wrap.onclick = e=>{ if(e.target===wrap) close(); };
}
function openScoreModal(title, current, onSave){
  const cur = current!=null ? Number(current) : 0.5;
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:fixed;inset:0;z-index:998;background:rgba(30,40,60,.45);display:flex;align-items:center;justify-content:center;padding:20px";
  wrap.innerHTML = `<div style="background:var(--white);border-radius:14px;max-width:420px;width:100%;padding:24px 26px;box-shadow:0 18px 60px rgba(0,0,0,.25)">
    <div style="font-family:Georgia,serif;font-size:1.15rem;color:var(--ink);margin-bottom:4px">${title}</div>
    <div style="font-size:.82rem;color:var(--muted);margin-bottom:14px">This override is saved to the knowledge base and logged as feedback for the agents.</div>
    <div style="display:flex;align-items:center;gap:14px">
      <input id="scoreRange" type="range" min="0" max="1" step="0.01" value="${cur.toFixed(2)}" style="flex:1;accent-color:var(--gold)">
      <input id="scoreNum" type="number" min="0" max="1" step="0.01" value="${cur.toFixed(2)}" style="width:84px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-align:center">
    </div>
    <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px"><span>0 · irrelevant</span><span>1 · top signal</span></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn ghost" id="scoreCancel">Cancel</button>
      <button class="btn navy" id="scoreSave">Save score</button>
    </div></div>`;
  document.body.appendChild(wrap);
  const range = wrap.querySelector("#scoreRange"), num = wrap.querySelector("#scoreNum");
  range.oninput = ()=>{ num.value = Number(range.value).toFixed(2); };
  num.oninput = ()=>{ const v = Math.max(0, Math.min(1, Number(num.value)||0)); range.value = v; };
  const close = ()=>wrap.remove();
  wrap.querySelector("#scoreCancel").onclick = close;
  wrap.onclick = e=>{ if(e.target===wrap) close(); };
  wrap.querySelector("#scoreSave").onclick = async ()=>{
    const v = Number(num.value);
    if(isNaN(v) || v<0 || v>1){ num.style.borderColor = "var(--bad)"; return; }
    wrap.querySelector("#scoreSave").disabled = true;
    try{ await onSave(Number(v.toFixed(2))); close(); }
    catch(e){ wrap.querySelector("#scoreSave").disabled = false; showAlert(String(e.body||e.message||e), "Save failed"); }
  };
}

  const wrap = document.createElement("div");

  try{ await sbPost("agent_feedback", Object.assign({ author: whoAmI() }, rec)); }

/* ---- comments ---- */

  let comments=[];

  catch(e){ return `<div class="notice">Comments need the <code>dashboard_comments</code> table — run the setup SQL.</div>`; }

    <div style="font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px">Comments (${comments.length})</div>

async function addComment(targetKey, elId){
  const inp = document.getElementById(elId+"_in");
  const body = (inp.value||"").trim(); if(!body) return;
  try{
    await sbPost("dashboard_comments", { target_key: targetKey, author: whoAmI(), body });
    Object.keys(cache).forEach(k=>{ if(k.startsWith("dashboard_comments")) delete cache[k]; });
    const html = await commentsBlock(targetKey, elId);
    document.getElementById(elId).outerHTML = html;
  }catch(e){ showAlert(String(e.body||e.message), "Comment failed — is the dashboard_comments table + policy set up?"); }
}

function editBrief(outputId, btn){
  const briefEl = document.querySelector("#briefBox .brief");
  if(!briefEl) return;
  window._briefEditing = true;
  briefEl.contentEditable = "true";
  briefEl.style.outline = "2px solid var(--gold)";
  briefEl.style.outlineOffset = "8px";
  briefEl.focus();
  if(btn) btn.style.display = "none";
  const bar = document.createElement("div");
  bar.className = "editing-bar"; bar.id = "briefEditBar";
  bar.innerHTML = `<span style="font-size:.82rem;color:var(--muted)">Editing — change the text directly, formatting is preserved.</span>
    <span style="flex:1"></span>
    <button class="btn ghost" onclick="window._briefEditing=false;renderIntel()">Cancel</button>
    <button class="btn navy" onclick="saveBrief('${esc(outputId)}')">Save changes</button>`;
  document.getElementById("briefBox").appendChild(bar);
}
async function saveBrief(outputId){
  const briefEl = document.querySelector("#briefBox .brief");
  if(!briefEl) return;
  const clone = briefEl.cloneNode(true);
  clone.querySelectorAll(".pill").forEach(p=>p.replaceWith(document.createTextNode(p.textContent)));
  let md;
  try{
    const td = new TurndownService({ headingStyle: "atx", hr: "---", bulletListMarker: "-" });
    td.keep(["table","thead","tbody","tr","th","td"]);
    md = td.turndown(clone.innerHTML);
  }catch(e){ md = clone.innerText; }
  try{
    const rows = await sbPatch(`agent_outputs?id=eq.${encodeURIComponent(outputId)}`, { content_md: md, edited_by_human: true });
    if(!rows.length) throw Object.assign(new Error("0 rows"), {status:403, body:"row-level security"});
    await saveFeedback({ agent:"intel_tracker", target_type:"brief_edit", target_id: String(outputId), action:"edited", feedback:"Brief manually edited on dashboard" }).catch(()=>{});
    window._briefEditing = false;
    Object.keys(cache).forEach(k=>delete cache[k]);
    renderIntel();
  }catch(e){

/* ---- live-sync brief engagement table with current draft statuses ---- */
function syncBriefQueue(drafts){
  const brief = document.querySelector("#briefBox .brief"); if(!brief || !drafts.length) return;
  const cells = brief.querySelectorAll("table td");
  for(const d of drafts){
    const snippet = String(d.draft||"").slice(0, 40).trim(); if(snippet.length < 15) continue;
    for(const td of cells){
      if(td.textContent.includes(snippet.slice(0, 30))){

/* ================= DATA ================= */
async function sb(path){
  if(cache[path]) return cache[path];
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`}
  });
  if(!res.ok){
    const body = await res.text();
    const err = new Error(`${res.status}`); err.body = body; err.status = res.status; throw err;
  }
  const data = await res.json();
  cache[path] = data;
  return data;
}
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function fmtDate(d){ if(!d) return "—"; const dt = new Date(d); if(isNaN(dt)) return esc(d);
  return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function fmtDateTime(d){ if(!d) return "—"; const dt = new Date(d); if(isNaN(dt)) return esc(d);
  return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short"}) + " · " + dt.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function freshness(d){ if(!d) return "none"; const days = (Date.now()-new Date(d))/864e5;
  return days<=1.5?"fresh":days<=4?"stale":"old"; }
function errNotice(e, what){
  const denied = e && (e.status===401 || e.status===403 || (e.body||"").includes("permission denied") || (e.body||"").includes("row-level security"));
  if(denied) return `<div class="notice err"><b>Can't read ${esc(what)} yet.</b> The table is blocking anonymous reads (row-level security).
    In Supabase run: <code>alter table ${esc(what)} enable row level security;</code> then
    <code>create policy "read_${esc(what)}" on ${esc(what)} for select to anon using (true);</code></div>`;
  if(e && e.status===404) return `<div class="notice"><b>${esc(what)}</b> table doesn't exist yet — it appears after the setup SQL is run.</div>`;
  return `<div class="notice err"><b>Couldn't load ${esc(what)}.</b> ${esc(e && e.message || "")}</div>`;
}

async function getRuns(agent){
  try{
    const outs = await sb(`agent_outputs?select=run_id,created_at,title&agent=eq.${agent}&order=created_at.desc&limit=40`);
    if(outs.length) return outs.map(o=>({run_id:o.run_id, when:o.created_at, title:o.title}));
  }catch(e){}
  try{
    const runs = await sb(`runs?select=run_id,started_at&agent=eq.${agent}&order=started_at.desc&limit=40`);
    return runs.map(r=>({run_id:r.run_id, when:r.started_at}));
  }catch(e){ return []; }
}
function friendlyRunLabel(when){
  if(!when) return "Unknown date";
  const dt = new Date(when); if(isNaN(dt)) return esc(when);
  const now = new Date();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diffDays = Math.round((startOfDay(now) - startOfDay(dt)) / 864e5);
  const time = dt.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  if(diffDays === 0) return `Today · ${time}`;
  if(diffDays === 1) return `Yesterday · ${time}`;
  const date = dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  return `${date} · ${time}`;
}
function runPicker(runs, current, cb){
  if(!runs.length) return "";
  const seen = {};
  const opts = runs.map(r=>{
    let label = friendlyRunLabel(r.when);
    if(seen[label]) label += ` (${++seen[label]})`; else seen[label] = 1;
    return `<option value="${esc(r.run_id)}" ${r.run_id===current?"selected":""}>${label}</option>`;
  }).join("");
  return `<div class="controls"><label>Run</label><select onchange="${cb}(this.value)">${opts}</select></div>`;
}

async function e1Data(){
  let leads=[], outs=[], err=null;
  try{ leads = await sb("e1_leads?select=*&order=updated_at.desc&limit=300"); }catch(e){ err=e; }
  try{ outs = await sb(`agent_outputs?select=id,run_id,agent,title,created_at,data,content_md&${E1_AGENT_FILTER}&order=created_at.desc&limit=1000`); }catch(e){ if(!err) err=e; }
  return {leads, outs, err};
}
function e1StageState(lead, outs, stage){
  const out = outs.find(o=>o.run_id===(lead?lead.email:null) && o.agent===stage.agent);
  const url = (lead && lead[stage.urlCol]) || (out && (asObj(out.data).pdfUrl || asObj(out.data).pdf_url)) || null;
  return {done: !!(out || url), out, url};
}
function fitPill(f){
  if(!f) return "";
  const cls = /strong/i.test(f)?"approved":/weak|disq/i.test(f)?"rejected":"pending";
  return `<span class="pill ${cls}">${esc(f)}</span>`;
}

function toggleE1Brief(i, agent){

  document.querySelectorAll(".e1brief.open").forEach(b=>{

    }
  });

function tNum(v){ return v==null||isNaN(v) ? null : Number(v); }
function tPct(a,b){ a=tNum(a); b=tNum(b); return (a==null||!b) ? null : (a/b*100); }
function tMoney(v){ return v==null ? "—" : "$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0}); }
function tShow(v,suffix){ return v==null ? "—" : Number(v).toFixed(v<10?2:1)+(suffix||""); }
function tBar(v,max,label){
  if(v==null||!max) return "—";
  const w = Math.max(3, Math.round(v/max*100));
  return `<div style="min-width:120px"><div style="font-size:.8rem;font-weight:650">${label}</div>
    <div style="height:7px;border-radius:99px;background:var(--cream);margin-top:3px"><div style="height:7px;border-radius:99px;width:${w}%;background:linear-gradient(90deg,var(--gold),#a8853a)"></div></div></div>`;
}

function ccBrief(){ return document.querySelector((window._ccSel&&window._ccSel.briefSel)||"#briefBox .brief"); }
function ccRail(){ return document.querySelector((window._ccSel&&window._ccSel.railSel)||"#cRail"); }
async function initBriefComments(targetKey, briefSel, railSel){
  window._ccSel = { briefSel: briefSel||"#briefBox .brief", railSel: railSel||"#cRail", targetKey };
  const brief = ccBrief(); const rail = ccRail();
  if(!brief || !rail) return;
  const blocks = [...brief.children].filter(el=>!["HR"].includes(el.tagName));
  blocks.forEach((el,i)=>{ el.dataset.cidx = i; el.title = "Click to comment on this section";
    el.addEventListener("click", (e)=>{ if(window._briefEditing) return; if(e.target.closest("a,button")) return; openComposer(targetKey, i, el); });
  });

async function fetchBriefComments(targetKey){
  try{ return await sb(`dashboard_comments?select=*&target_key=eq.${encodeURIComponent(targetKey)}&order=created_at.asc&limit=200`); }
  catch(e){ return null; }
}
async function paintRail(targetKey){
  const brief = ccBrief(); const rail = ccRail();
  if(!brief || !rail) return;
  const comments = await fetchBriefComments(targetKey);
  if(comments===null){ rail.innerHTML = `<div class="notice">Comments need the <code>dashboard_comments</code> table + SQL.</div>`; return; }
  brief.querySelectorAll("[data-cidx]").forEach(el=>el.classList.remove("hl","hl-active"));
  rail.innerHTML = "";
  const byAnchor = {};
  comments.filter(c=>!c.parent_id).forEach(c=>{
    const k = c.anchor_index==null ? "general" : String(c.anchor_index);
    (byAnchor[k] = byAnchor[k]||[]).push(c);
  });
  const replies = pid => comments.filter(c=>String(c.parent_id)===String(pid));
  let lastBottom = 0;
  const keys = Object.keys(byAnchor).sort((a,b)=>(a==="general"?-1:b==="general"?1:Number(a)-Number(b)));
  for(const k of keys){
    const list = byAnchor[k];
    let top = 0, anchorText = "";
    if(k!=="general"){
      const el = brief.querySelector(`[data-cidx="${k}"]`);
      if(el){ el.classList.add("hl"); top = el.offsetTop; anchorText = el.textContent.slice(0,110); }
    }
    const card = document.createElement("div");
    card.className = "c-card";
    card.innerHTML = `
      ${anchorText?`<div class="c-anchor">"${esc(anchorText)}…"</div>`:`<div class="c-anchor" style="border-color:var(--line)">General comment</div>`}
      ${list.map(c=>`
        <div class="c-msg">
          <div class="c-who"><b>${esc(c.author||"Team")}</b> <span style="color:var(--muted)">· ${fmtDateTime(c.created_at)}</span></div>
          <div style="white-space:pre-wrap">${esc(c.body||"")}</div>
          ${replies(c.id).map(r=>`<div class="c-msg c-reply"><div class="c-who"><b>${esc(r.author||"Team")}</b> <span style="color:var(--muted)">· ${fmtDateTime(r.created_at)}</span></div><div style="white-space:pre-wrap">${esc(r.body||"")}</div></div>`).join("")}
          <div class="c-actions"><a onclick="toggleReply('${esc(c.id)}')">Reply</a></div>
          <div id="rep_${esc(c.id)}" style="display:none"><input placeholder="Reply…" onkeydown="if(event.key==='Enter')sendReply('${esc(targetKey)}','${esc(c.id)}',${c.anchor_index==null?"null":Number(c.anchor_index)},this)"></div>
        </div>`).join("")}`;
    card.addEventListener("mouseenter", ()=>{ if(k!=="general"){ const el=brief.querySelector(`[data-cidx="${k}"]`); if(el) el.classList.add("hl-active"); } });
    card.addEventListener("mouseleave", ()=>{ if(k!=="general"){ const el=brief.querySelector(`[data-cidx="${k}"]`); if(el) el.classList.remove("hl-active"); } });
    rail.appendChild(card);
    card.style.top = Math.max(top, lastBottom) + "px";
    lastBottom = Math.max(top, lastBottom) + card.offsetHeight + 12;
  }
  rail.style.minHeight = lastBottom + "px";
}

/* ---------- brief formatting: meta grid + shift cards ---------- */
function pairsFromHtml(html){
  const parts = String(html).split(/<strong>/i);
  const out = [];
  for(let i=1;i<parts.length;i++){
    const seg = parts[i];
    const close = seg.search(/<\/strong>/i);
    if(close < 0) continue;
    const label = seg.slice(0, close).replace(/:\s*$/,"").trim();
    let val = seg.slice(close).replace(/^<\/strong>/i,"");
    val = val.replace(/^\s*:?\s*/,"").replace(/\s*·\s*$/,"").trim();
    out.push({ label, html: val });
  }
  return out;
}
function enhanceBriefFormatting(root){
  if(!root) return;
  root.querySelectorAll("p").forEach(p=>{
    if(p.dataset.fmt) return;
    const firstStrong = p.querySelector("strong");
    if(!firstStrong) return;
    const lead = firstStrong.textContent.replace(/:\s*$/,"").trim();
    if(lead === "Prepared by"){
      const pairs = pairsFromHtml(p.innerHTML);
      if(pairs.length >= 2){
        const grid = document.createElement("div");
        grid.className = "meta-grid"; grid.dataset.fmt = "1";
        grid.innerHTML = pairs.map(x=>`<div><div class="mg-label">${esc(x.label)}</div><div class="mg-value">${x.html}</div></div>`).join("");
        p.replaceWith(grid);
      }
    } else if(lead === "Shift"){
      const pairs = pairsFromHtml(p.innerHTML);
      if(pairs.length){
        const card = document.createElement("div");
        card.className = "shift-card"; card.dataset.fmt = "1";
        card.innerHTML = pairs.map(x=>{
          const l = x.label.toLowerCase();
          const cls = l.startsWith("implication") ? "imp" : l.startsWith("evidence") ? "ev" : "";
          const tag = l.startsWith("implication") ? "For our ads" : x.label;
          return `<div class="s-row"><span class="s-tag ${cls}">${esc(tag)}</span><span>${x.html}</span></div>`;
        }).join("");
        p.replaceWith(card);
      }
    }
    p.dataset && (p.dataset.fmt = "1");
  });
}
function enhanceAllBriefs(){
  document.querySelectorAll("#main .brief").forEach(enhanceBriefFormatting);
}


/* ============ NOTIFICATIONS + PER-USER SEEN BADGES ============ */
function seenKey(k){ return "aip_seen_" + (sessionStorage.getItem("aip_user")||"team").toLowerCase() + "_" + k; }
function viewOfTargetKey(tk){
  if(tk.startsWith("adsbrief:")) return "ads";
  if(tk.startsWith("funnel:")) return "funnel";
  if(tk.startsWith("e1:")) return "e1:" + (tk.split(":")[1]||"");
  return "intel";
}
async function collectSignals(){
  const me = sessionStorage.getItem("aip_user")||"";
  const out = { pendingDrafts:0, latestDraftTs:null, latestAdsTs:null, latestFunnelTs:null, pendingVariants:0, comments:[] };
  try{
    const drafts = await sb("engagement_drafts?select=id,status,created_at&order=created_at.desc&limit=200");
    const pend = drafts.filter(d=>!d.status||d.status==="pending");
    out.pendingDrafts = pend.length;
    out.latestDraftTs = pend.length ? pend[0].created_at : null;
  }catch(e){}
  try{
    const ao = await sb("agent_outputs?select=agent,created_at,data&order=created_at.desc&limit=30");
    const ads = ao.find(o=>o.agent==="ad_strategist");
    if(ads) out.latestAdsTs = ads.created_at;
    const fn = ao.find(o=>o.agent==="low_ticket_content");
    if(fn){
      out.latestFunnelTs = fn.created_at;
      const imgs = (asObj(fn.data).ad_images||[]).map(v=>v.file).filter(Boolean);
      if(imgs.length){
        try{
          const fb = await sb("agent_feedback?select=target_id&target_type=eq.ad_image_variant&limit=300");
          const decided = new Set(fb.map(r=>r.target_id));
          out.pendingVariants = imgs.filter(f=>!decided.has(f)).length;
        }catch(e){ out.pendingVariants = imgs.length; }
      }
    }
  }catch(e){}
  try{
    const cs = await sb("dashboard_comments?select=id,target_key,author,body,created_at,parent_id&order=created_at.desc&limit=60");
    const lastSeen = localStorage.getItem(seenKey("comments")) || "1970-01-01";
    out.comments = cs.filter(c=>(c.author||"") !== me && c.created_at > lastSeen);
  }catch(e){}
  return out;
}
async function refreshNotifications(){
  const sig = await collectSignals();
  window._navSig = sig;
  /* nav badges — hidden once the user has viewed the current state */
  const badge = (view, count, ts)=>{
    const btn = document.querySelector(`#nav [data-view-btn="${view}"]`); if(!btn) return;
    let el = btn.querySelector(".n");
    const seenTs = localStorage.getItem(seenKey("view_"+view)) || "";
    const isNew = count>0 && (!ts || ts > seenTs);
    if(isNew){ if(!el){ el=document.createElement("span"); el.className="n"; btn.appendChild(el); } el.textContent = count; }
    else if(el) el.remove();
  };
  badge("intel", sig.pendingDrafts, sig.latestDraftTs);
  badge("ads", sig.latestAdsTs ? 1 : 0, sig.latestAdsTs);
  badge("funnel", sig.pendingVariants, sig.latestFunnelTs);
  /* bell */
  const actions = (sig.pendingDrafts?1:0) + (sig.pendingVariants?1:0);
  const total = sig.comments.length + actions;
  const cEl = document.getElementById("notifCount");
  if(cEl){ cEl.style.display = total ? "block" : "none"; cEl.textContent = total; }
}
function markViewSeen(view){
  const sig = window._navSig || {};
  const ts = view==="intel" ? sig.latestDraftTs : view==="ads" ? sig.latestAdsTs : view==="funnel" ? sig.latestFunnelTs : null;
  if(ts) localStorage.setItem(seenKey("view_"+view), ts);
  const btn = document.querySelector(`#nav [data-view-btn="${view}"] .n`); if(btn) btn.remove();
}
function toggleNotif(){
  const ex = document.getElementById("notifPanel");
  if(ex){ ex.remove(); return; }
  const sig = window._navSig || { comments:[], pendingDrafts:0, pendingVariants:0 };
  const bell = document.getElementById("notifBell");
  const r = bell.getBoundingClientRect();

const ASANA_API = "https://app.asana.com/api/1.0";
const aCache = {};
function aStore(k,v){ v ? localStorage.setItem("asana_"+k, v) : localStorage.removeItem("asana_"+k); }
function aRead(k){ return localStorage.getItem("asana_"+k) || ""; }

async function asana(path, method="GET", body=null, useCache=true){
  const ck = method+path;
  if(method==="GET" && useCache && aCache[ck] && (Date.now()-aCache[ck].t)<45000) return aCache[ck].v;
  const res = await fetch(ASANA_API+path, {
    method,
    headers: { Authorization: "Bearer "+aRead("pat"), ...(body?{"Content-Type":"application/json"}:{}) },
    body: body ? JSON.stringify({data: body}) : null
  });
  if(res.status===401) throw Object.assign(new Error("Asana rejected the token."), {auth:true});
  if(!res.ok){
    let msg = ""; try{ msg = (await res.json()).errors?.[0]?.message || ""; }catch(e){}
    throw new Error(msg || `Asana error ${res.status}`);
  }
  const v = (await res.json()).data;
  if(method==="GET") aCache[ck] = {t: Date.now(), v};
  return v;
}
function aClearCache(){ Object.keys(aCache).forEach(k=>delete aCache[k]); }

async function loadAsanaTasks(me){
  const list = document.getElementById("taskList");
  if(!aRead("project")){ list.innerHTML = `<div class="empty"><div class="big">No project selected</div>Create a project in Asana, then hit Refresh.</div>`; return; }
  let tasks;
  try{
    tasks = await asana(`/projects/${aRead("project")}/tasks?limit=100&opt_fields=name,completed,completed_at,due_on,assignee.name,assignee.gid,permalink_url`);
  }catch(e){ list.innerHTML = errNotice(e, "asana_tasks"); return; }
  const filter = aRead("filter") || "open";
  let rows = tasks;
  if(filter==="open") rows = tasks.filter(t=>!t.completed);
  if(filter==="mine") rows = tasks.filter(t=>!t.completed && t.assignee && me && t.assignee.gid===me.gid);
  if(filter==="done") rows = tasks.filter(t=>t.completed).sort((a,b)=>String(b.completed_at||"").localeCompare(String(a.completed_at||""))).slice(0,30);
  if(!rows.length){
    list.innerHTML = `<div class="empty"><div class="big">${filter==="done"?"Nothing completed recently":"All clear 🎉"}</div>${filter==="done"?"Completed tasks will show up here.":"No open tasks in this view."}</div>`;
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  list.innerHTML = rows.map(t=>{
    let due = "";
    if(t.due_on){
      const cls = t.completed ? "" : (t.due_on < today ? "overdue" : (t.due_on === today ? "today" : ""));
      due = `<span class="due ${cls}">${t.due_on === today ? "Today" : fmtDate(t.due_on)}</span>`;
    }
    return `<div class="item">
      <button class="tcheck ${t.completed?"done":""}" title="${t.completed?"Reopen":"Mark complete"}" onclick="toggleAsanaTask('${t.gid}', ${t.completed?"false":"true"}, this)">✓</button>
      <div class="txt"><p class="task-name ${t.completed?"done":""}"><a href="${esc(t.permalink_url||"#")}" target="_blank" rel="noopener">${esc(t.name||"(untitled)")}</a></p></div>
      ${t.assignee ? `<span class="asg">${esc(t.assignee.name)}</span>` : ""}
      ${due}
    </div>`;
  }).join("");
}

async function toggleAsanaTask(gid, completed, btn){
  btn.disabled = true;
  try{
    await asana(`/tasks/${gid}`, "PUT", {completed});
    aClearCache();
    const me = await asana("/users/me?opt_fields=name,gid");
    loadAsanaTasks(me);
  }catch(e){ btn.disabled=false; showAlert ? showAlert("Asana update failed: "+(e.message||e)) : alert("Asana update failed: "+(e.message||e)); }
}

async function addAsanaTask(){
  const inp = document.getElementById("newTask");
  const name = (inp.value||"").trim();
  if(!name) return;
  inp.disabled = true;
  try{
    await asana("/tasks", "POST", {name, projects:[aRead("project")]});
    inp.value = ""; inp.disabled = false; inp.focus();
    aClearCache();
    const me = await asana("/users/me?opt_fields=name,gid");
    loadAsanaTasks(me);
  }catch(e){ inp.disabled=false; showAlert ? showAlert("Couldn't add task: "+(e.message||e)) : alert("Couldn't add task: "+(e.message||e)); }
}

async function connectAsana(){
  const tok = (document.getElementById("asanaTok").value||"").trim();
  const err = document.getElementById("asanaConnErr");
  if(!tok){ err.textContent = "Paste your token first."; return; }
  err.textContent = "";
  aStore("pat", tok);
  try{
    await asana("/users/me?opt_fields=name,gid", "GET", null, false);
    aClearCache();
    renderTasks();
  }catch(e){
    aStore("pat","");
    err.textContent = e.auth ? "Asana didn't accept that token — copy it again from app.asana.com/0/my-apps." : "Couldn't reach Asana: "+(e.message||e);
  }
}
function disconnectAsana(){
  ["pat","ws","project","filter"].forEach(k=>aStore(k,""));

}

  }
}

  const res = await fetch(hook, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error("Webhook error "+res.status+" — is the n8n workflow active?");
  return res.json();
}

async function pInsertSuggestions(list, existingNames){
  const names = new Set(existingNames.map(n=>String(n||"").toLowerCase()));
  let added = 0;
  for(const c of (list||[])){
    if(!c || !c.name || names.has(String(c.name).toLowerCase())) continue;
    await sbPost("competitors", { name:c.name, website:c.website||null, notes:c.reason||"", status:"suggested", source:"ai", added_by: whoAmI() });
    names.add(String(c.name).toLowerCase()); added++;
  }
  return added;
}

async function pAnalyze(){
  const website = pVal("website");
  if(!website){ showAlert("Enter the website first, then hit Analyze.","No website"); return; }
  const btn = document.getElementById("pAnalyzeBtn");
  btn.disabled = true; btn.textContent = "Analyzing…";
  try{
    const existing = (await pFresh("competitors?select=name")).map(c=>c.name);
    const out = await pCallEnrich({ website, businessName: pVal("business_name"),
      context: [pVal("industry"), pVal("description")].filter(Boolean).join(" — "), existing });
    if(!out){ btn.disabled=false; btn.textContent="✦ Analyze website"; return; }
    const p = out.profile || {};
    P_FIELDS.forEach(([k])=>{
      if(k==="contact_name"||k==="website") return;
      const el = document.getElementById("pf_"+k); if(!el) return;
      if(p[k] && (!el.value.trim() || ["industry","description","services","target_market"].includes(k))) el.value = p[k];
    });
    await pSave(null,false);
    await pInsertSuggestions(out.competitors, existing);
    renderProfile();
  }catch(e){
    showAlert(e.message||String(e), "Analyze failed");
    btn.disabled = false; btn.textContent = "✦ Analyze website";
  }
}

async function pRecommend(){
  const btn = document.getElementById("pRecBtn");
  btn.disabled = true; btn.textContent = "Thinking…";
  try{
    const existing = (await pFresh("competitors?select=name")).map(c=>c.name);
    const context = P_FIELDS.map(([k,label])=>{ const v=pVal(k); return v?`${label}: ${v}`:""; }).filter(Boolean).join("\n");
    const out = await pCallEnrich({ website: pVal("website"), businessName: pVal("business_name"), context, existing });
    if(!out){ btn.disabled=false; btn.textContent="✦ Suggest more"; return; }
    const added = await pInsertSuggestions(out.competitors, existing);
    if(!added) showAlert("No new competitors found beyond what's already listed.","Nothing new");
    renderProfile();
  }catch(e){
    showAlert(e.message||String(e), "Suggestion failed");
    btn.disabled = false; btn.textContent = "✦ Suggest more";
  }
}

/* ================= NOTES (NOTION) ================= */
const nCache = {};
function nStore(k,v){ v ? localStorage.setItem("notion_"+k, v) : localStorage.removeItem("notion_"+k); }
function nRead(k){ return localStorage.getItem("notion_"+k) || ""; }
function nClearCache(){ Object.keys(nCache).forEach(k=>delete nCache[k]); }

async function notion(path, method="GET", body=null, useCache=true){
  const ck = method+path+JSON.stringify(body||"");
  if(useCache && nCache[ck] && (Date.now()-nCache[ck].t)<45000) return nCache[ck].v;
  const res = await fetch(nRead("proxy"), {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ path, method, token: nRead("secret"), body })
  });
  if(!res.ok) throw new Error(`Proxy error ${res.status} — is the n8n workflow active?`);
  const v = await res.json();
  if(v && v.object==="error"){
    const e = new Error(v.message || v.code || "Notion error");
    if(v.status===401 || v.code==="unauthorized") e.auth = true;
    throw e;
  }
  nCache[ck] = {t: Date.now(), v};
  return v;
}

function notionHero(sub, right){
  return `<div class="page-head"><div>
    <div class="eyebrow">Workspace · Notes</div>
    <h1 class="page">Notion</h1>
    <div class="page-sub">${sub}</div></div>${right||""}</div>`;
}
function nTitle(page){
  const props = page.properties||{};
  for(const k in props){ if(props[k].type==="title") return (props[k].title||[]).map(t=>t.plain_text).join("") || "(untitled)"; }
  return "(untitled)";
}
function nStatus(page){
  const props = page.properties||{};
  for(const k in props){
    if(props[k].type==="status" && props[k].status) return props[k].status.name;
    if(props[k].type==="select" && props[k].select) return props[k].select.name;
  }
  return "";
}

async function renderNotion(){
  const main = document.getElementById("main");
  if(!nRead("secret") || !nRead("proxy")){
    main.innerHTML = notionHero("Connect Notion to browse and add database entries from here. Needs a one-time proxy setup because Notion's API can't be called from a browser directly.") + `
    <div class="cols" style="margin-top:0">
      <div class="panel">
        <div class="panel-head"><h2>Connect Notion in 4 steps</h2></div>
        <div class="item"><div class="stepnum">1</div><div class="txt">
          <p><b>Create a Notion integration</b></p>
          <small>Open <a href="https://www.notion.so/my-integrations" target="_blank" rel="noopener" style="color:var(--navy);text-decoration:underline;text-decoration-color:var(--gold)">notion.so/my-integrations</a> → "New integration" → copy the Internal Integration Secret.</small>
        </div></div>
        <div class="item"><div class="stepnum">2</div><div class="txt">
          <p><b>Share your database with it</b></p>
          <small>In Notion, open the database → ••• menu → "Connections" → add your integration. Only shared databases are visible.</small>
        </div></div>
        <div class="item"><div class="stepnum">3</div><div class="txt">
          <p><b>Import the proxy workflow into n8n</b></p>
          <small>Import <b>notion-proxy-workflow.json</b> (provided with this dashboard) into n8n, activate it, and copy the production webhook URL. This tiny workflow only forwards requests — the secret is never stored in n8n.</small>
        </div></div>
        <div class="item"><div class="stepnum">4</div><div class="txt">
          <p><b>Paste both below and connect</b></p>
        </div></div>
        <div class="tokenrow">
          <input id="notionProxy" type="text" placeholder="n8n webhook URL, e.g. https://n8n.aiparagonconsulting.com/webhook/notion-proxy" value="${esc(nRead("proxy"))}">
        </div>
        <div class="tokenrow">
          <input id="notionSecret" type="password" placeholder="Notion integration secret (starts with ntn_ or secret_)…" onkeydown="if(event.key==='Enter')connectNotion()">
          <button class="btn navy" style="padding:10px 20px" onclick="connectNotion()">Connect</button>
        </div>
        <div id="notionConnErr" style="color:var(--bad);font-size:.82rem;margin-top:10px;min-height:1.2em"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>What you get</h2></div>
        <div class="item"><div class="srcav">▤</div><div class="txt"><p>Browse any shared database</p><small>Entries with status and last-edited date, newest first.</small></div></div>
        <div class="item"><div class="srcav">＋</div><div class="txt"><p>Quick-add entries</p><small>Type a title, press Enter, it lands in the selected database.</small></div></div>
        <div class="item"><div class="srcav">↗</div><div class="txt"><p>One click to the full page</p><small>Every entry links straight into Notion.</small></div></div>
        <div class="notice" style="margin-top:14px">Your secret is stored only in this browser and sent through your own n8n instance — never to any third party.</div>
      </div>
    </div>`;
    return;
  }

  main.innerHTML = notionHero("Loading your Notion databases…");
  let dbs;
  try{
    const r = await notion("/search", "POST", {filter:{property:"object", value:"database"}, page_size: 50});
    dbs = (r.results||[]).map(d=>({id:d.id, name:(d.title||[]).map(t=>t.plain_text).join("")||"(untitled database)"}));
  }catch(e){ return notionFail(e); }

  if(!dbs.length){
    main.innerHTML = notionHero("Connected, but no databases are shared with the integration yet.",
      `<button class="btn ghost" style="background:rgba(255,255,255,.12);color:#E8EDF4;box-shadow:none" onclick="disconnectNotion()">Disconnect</button>`) +
      `<div class="empty"><div class="big">Share a database with your integration</div>
       In Notion: open the database → ••• → Connections → add your integration. Then hit refresh.
       <div style="margin-top:14px"><button class="btn navy" onclick="nClearCache();renderNotion()">↻ Refresh</button></div></div>`;
    return;
  }
  if(!nRead("db") || !dbs.find(d=>d.id===nRead("db"))) nStore("db", dbs[0].id);

  main.innerHTML = notionHero(`Connected · ${dbs.length} database${dbs.length===1?"":"s"} shared with the integration.`,
      `<button class="btn ghost" style="background:rgba(255,255,255,.12);color:#E8EDF4;box-shadow:none" onclick="disconnectNotion()">Disconnect</button>`) + `
    <div class="controls" style="margin-bottom:18px">
      <label>Database</label>
      <select onchange="nStore('db',this.value);renderNotion()">
        ${dbs.map(d=>`<option value="${d.id}" ${d.id===nRead("db")?"selected":""}>${esc(d.name)}</option>`).join("")}
      </select>
      <button class="btn ghost" onclick="nClearCache();renderNotion()">↻ Refresh</button>
    </div>
    <div class="panel">
      <div class="addrow">
        <input id="newNote" type="text" placeholder="Add an entry and press Enter…" onkeydown="if(event.key==='Enter')addNotionPage()">
        <button class="btn navy" style="padding:10px 20px" onclick="addNotionPage()">Add entry</button>
      </div>
      <div id="noteList"><div class="loading">Loading entries…</div></div>
    </div>
    <div class="notice" style="margin-top:18px">Entries live in <b>Notion</b> — click any title to open the full page there.</div>`;

  loadNotionPages();
}

async function loadNotionPages(){
  const list = document.getElementById("noteList");
  try{
    const r = await notion(`/databases/${nRead("db")}/query`, "POST",
      {page_size: 50, sorts:[{timestamp:"last_edited_time", direction:"descending"}]});
    const pages = r.results||[];
    if(!pages.length){ list.innerHTML = `<div class="empty"><div class="big">No entries yet</div>Add the first one above.</div>`; return; }
    list.innerHTML = pages.map(p=>`<div class="item">
      <div class="srcav">▤</div>
      <div class="txt"><p><a href="${esc(p.url||"#")}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(nTitle(p))}</a></p>
      <small>edited ${fmtDate(p.last_edited_time)}</small></div>
      ${nStatus(p)?`<span class="pill posted">${esc(nStatus(p))}</span>`:""}
    </div>`).join("");
  }catch(e){ list.innerHTML = errNotice(e, "notion"); }
}

async function addNotionPage(){
  const inp = document.getElementById("newNote");
  const name = (inp.value||"").trim();
  if(!name) return;
  inp.disabled = true;
  try{
    const db = await notion(`/databases/${nRead("db")}`);
    let titleProp = "Name";
    for(const k in (db.properties||{})){ if(db.properties[k].type==="title"){ titleProp = k; break; } }
    await notion("/pages", "POST", {
      parent: {database_id: nRead("db")},
      properties: { [titleProp]: { title: [{ text: { content: name } }] } }
    }, false);
    inp.value = ""; inp.disabled = false; inp.focus();
    nClearCache();
    loadNotionPages();
  }catch(e){ inp.disabled=false; showAlert ? showAlert("Couldn't add entry: "+(e.message||e)) : alert("Couldn't add entry: "+(e.message||e)); }
}

async function connectNotion(){
  const proxy = (document.getElementById("notionProxy").value||"").trim();
  const secret = (document.getElementById("notionSecret").value||"").trim();
  const err = document.getElementById("notionConnErr");
  if(!proxy || !secret){ err.textContent = "Both the webhook URL and the secret are needed."; return; }
  err.textContent = "";
  nStore("proxy", proxy); nStore("secret", secret);
  try{
    await notion("/users/me", "GET", null, false);
    nClearCache();
    renderNotion();
  }catch(e){
    nStore("secret","");
    err.textContent = e.auth ? "Notion didn't accept that secret — copy it again from notion.so/my-integrations."
      : "Connection failed: "+(e.message||e);
  }
}
function disconnectNotion(){
  ["secret","db"].forEach(k=>nStore(k,""));
  nClearCache();
  renderNotion();
}
function notionFail(e){
  const main = document.getElementById("main");
  if(e.auth){
    main.innerHTML = notionHero("Your saved Notion secret stopped working.") +
      `<div class="notice err">Notion rejected the saved secret — it may have been revoked.
       <div style="margin-top:10px"><button class="btn navy" onclick="disconnectNotion()">Disconnect &amp; reconnect</button></div></div>`;
  } else {
    main.innerHTML = notionHero("Couldn't reach Notion through the proxy.") + errNotice(e, "notion");
  }
}

/* ================= PASSWORD GATE ================= */
async function sha256Hex(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function tryUnlock(){
  const u = (document.getElementById("userInput").value||"").trim().toLowerCase();
  const v = document.getElementById("pwInput").value;
  const errEl = document.getElementById("pwError");
  if(!u || !v){ errEl.textContent = "Enter username and password."; return; }
  errEl.textContent = "";
  let rows;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/dashboard_users?username=eq.${encodeURIComponent(u)}&active=is.true&select=username,display_name,salt,password_hash`,
      { headers:{ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
    if(!res.ok) throw new Error(await res.text());
    rows = await res.json();
  }catch(e){
    errEl.textContent = "Can't reach the user directory — is the dashboard_users table set up?";
    return;
  }
  const user = rows && rows[0];
  if(user && (await sha256Hex((user.salt||"") + v)) === user.password_hash){
    sessionStorage.setItem("aip_unlocked","1");
    sessionStorage.setItem("aip_user", user.display_name || (u.charAt(0).toUpperCase()+u.slice(1)));
    document.getElementById("lockScreen").remove();
    render();
  } else {
    errEl.textContent = "Incorrect username or password.";
    document.getElementById("pwInput").select();
  }
}
if(sessionStorage.getItem("aip_unlocked")==="1" && sessionStorage.getItem("aip_user")){
  document.getElementById("lockScreen").remove();
  render();
} else {
  sessionStorage.removeItem("aip_unlocked");
  setTimeout(()=>document.getElementById("userInput").focus(), 50);
}
